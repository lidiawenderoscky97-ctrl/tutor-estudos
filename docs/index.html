}
// Remonta a árvore (a lista do TEC vem "achatada": grupo, subassuntos, sub-subassuntos...) e devolve só as folhas,
// cada uma com os nomes dos grupos acima como contexto. Um item só é grupo quando os itens seguintes somam
// o total dele (com uma pequena folga para questões marcadas direto no grupo) e, havendo artigos de lei nos nomes,
// quando os artigos dos filhos estão dentro da faixa do grupo.
function tecSoFolhas(itens, arvore){
  const n = itens.length, memo = new Map(), escolha = new Map(), fimPai = new Map();
  const arts = itens.map(x => tecArtigos(x.nome));
  const folga = p => { const q = itens[p].q; return Math.max(Math.min(3, Math.floor(q * 0.1)), Math.floor(q * 0.03)); };
  const cabe = (i, p) => !arts[i].length || !arts[p].length || tecSobreposicao(arts[i], arts[p]) >= 0.999;
  let passos = 0;
  function filhos(i, alvo, p){
    if(alvo === 0) return i;
    const k = i + '|' + alvo + '|' + p;
    if(memo.has(k)) return memo.get(k);
    memo.set(k, -1);
    let r = -1;
    if(i < n && ++passos < 300000 && cabe(i, p) && itens[i].q <= alvo + folga(p)){
      const fp = paiAte(i);
      for(const fim of (fp > i + 1 ? [fp, i + 1] : [i + 1])){
        const resto = filhos(fim, alvo - itens[i].q, p);
        if(resto >= 0){ r = resto; escolha.set(k, fim); break; }
      }
    }
    if(r < 0 && i > p + 1 && Math.abs(alvo) <= folga(p)) r = i;
    memo.set(k, r); return r;
  }
  function paiAte(p){                  // fim dos filhos de p, ou -1 se p não é grupo
    if(fimPai.has(p)) return fimPai.get(p);
    fimPai.set(p, -1);
    let fim = p + 1 < n && itens[p].q > 0 ? filhos(p + 1, itens[p].q, p) : -1;
    if(fim === p + 2 && itens[p + 1].q !== itens[p].q) fim = -1;   // um filho só, sem bater o total: não é grupo
    fimPai.set(p, fim); return fim;
  }
  const folhas = [], raizes = [];
  function montar(p, pais, no){
    let i = p + 1, alvo = itens[p].q;
    while(true){
      const fim = escolha.get(i + '|' + alvo + '|' + p);
      if(fim === undefined) break;
      const filho = {nome:itens[i].nome, q:itens[i].q, filhos:[]}; no.filhos.push(filho);
      if(fim > i + 1) montar(i, pais.concat(itens[i].nome), filho);
      else folhas.push({nome:itens[i].nome, q:itens[i].q, contexto:pais.join(' '), caminho:pais.slice()});
      alvo -= itens[i].q; i = fim;
    }
    if(alvo >= 3 && pais.length > 1) folhas.push({nome:itens[p].nome, q:alvo, contexto:pais.slice(0, -1).join(' '), caminho:pais.slice(0, -1), sobra:true});
  }
  let i = 0;
  while(i < n){
    const fp = paiAte(i), no = {nome:itens[i].nome, q:itens[i].q, filhos:[]}; raizes.push(no);
    if(fp > i + 1){ montar(i, [itens[i].nome], no); i = fp; }
    else { folhas.push({nome:itens[i].nome, q:itens[i].q, contexto:'', caminho:[]}); i++; }
  }
  return arvore ? raizes : folhas;
}
// Edital verticalizado a partir do Guia do TEC: cada caderno por matéria vira uma matéria; os assuntos saem da árvore
// do caderno (abrindo os grupos maiores até ~12–25 assuntos) e a incidência é o nº de questões de cada um.
function tecItensBrutos(txt){
  const L = String(txt).split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim().replace(/^uma quest(ão|ao)\b/i,'1 questão')).filter(Boolean), itens = [];
  for(let i=1;i<L.length;i++){ const m = L[i].match(/^(\d{1,6})\s+quest(?:ões|oes|ão|ao)\b/i); if(m && !/quest(?:ões|oes|ão|ao)\b/i.test(L[i-1]) && !/^@@/.test(L[i-1])) itens.push({nome:L[i-1], q:+m[1]}); }
  return itens;
}
function tecAssuntosDaArvore(raizes){
  const total = raizes.reduce((s,r)=>s+r.q,0) || 1;
  let nos = raizes.flatMap(r => r.filhos.length ? r.filhos : [r]);   // a raiz é o nome da matéria no TEC
  for(let k = 0; k < 80 && nos.length < 40; k++){
    const sh = x => x.q / total;
    const cand = nos.filter(x => x.filhos.length >= 2 && (sh(x) > .2 || (nos.length < 12 && sh(x) > .04) || (nos.length < 25 && sh(x) > .1))).sort((a,b)=>b.q-a.q)[0];
    if(!cand) break;
    const i = nos.indexOf(cand); nos.splice(i, 1, ...cand.filhos);
  }
  nos = nos.filter(x => x.q > 0);
  const pouco = nos.filter(x => x.q < Math.max(3, total * .012));   // assuntos com pouquíssimas questões viram um só
  if(pouco.length >= 2){ nos = nos.filter(x => !pouco.includes(x)); nos.push({nome:'Demais assuntos (pouco cobrados): ' + pouco.map(x=>x.nome.replace(/\s*\(.*?\)\s*/g,' ').trim()).slice(0,6).join('; ') + (pouco.length>6?'…':''), q: pouco.reduce((s,x)=>s+x.q,0), filhos:[]}); }
  return nos;
}
function editalDoGuia(txt){
  const guia = (txt.match(/^@@guia (.*)$/m)||[])[1] || '', banca = ((txt.match(/^@@banca (.*)$/m)||[])[1] || '').trim();
  const blocos = txt.split(/^(?=@@caderno )/m).filter(b => /^@@caderno /.test(b));
  const mats = [];
  blocos.forEach(b => {
    const cab = b.match(/^@@caderno (\S+)(?: \| (.*))?/); const titulo = (cab[2]||'').trim();
    if(/^(in[ée]ditas|simulado|quest[õo]es in[ée]ditas|revis[ãa]o)/i.test(titulo)) return;
    const nome = titulo.replace(/\s+para\s+.*$/i, '').replace(/\s+-\s+.*\b(19|20)\d{2}\s*$/, '').trim() || titulo;
    const nos = tecAssuntosDaArvore(tecSoFolhas(tecItensBrutos(b), true));
    if(nos.length) mats.push({nome, link: cab[1], nos, total: nos.reduce((s,x)=>s+x.q,0)});
  });
  // concurso: "Guia TC DF / 2026 para concurso Analista ..." → "TC DF 2026 – Analista ..."
  let concurso = guia.replace(/^Guia\s+/i,'').replace(/\s*\/\s*/,' ').replace(/\s+para concurso\s+/i,' – ').trim();
  if(!concurso && blocos.length){ const t = (blocos[0].match(/ \| (.*)/)||[])[1]||''; concurso = (t.match(/\s+para\s+(.*)$/i)||[])[1] || ''; }
  const L = [`// Criado a partir dos cadernos do Guia do TEC. Incidência = nº de questões de cada assunto nos cadernos.`, `@concurso: ${concurso}`, `@banca: ${banca}`];
  mats.forEach(m => { const media = m.total / m.nos.length;
    L.push('', `${m.nome.replace(/\|/g,'/')} | 3 | 3`, `@tec: ${m.link}`);
    m.nos.forEach(x => L.push(`- ${x.nome.replace(/[\[\]]/g, s => s==='['?'(':')').replace(/[#*|]/g,' ').replace(/\s+/g,' ').trim()} *${tecNivel(x.q, media)} %${x.q}`));
  });
  return {texto: L.join('\n'), materias: mats.length, assuntos: mats.reduce((s,m)=>s+m.nos.length,0), concurso};
}

// Planilha exportada do caderno: conta as questões por valor da coluna "Assunto"
async function tecLerPlanilha(file){
  if(!window.XLSX) await new Promise((ok,err)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=ok; s.onerror=()=>err(new Error('não foi possível carregar o leitor de planilhas')); document.head.appendChild(s); });
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
  const iCab = linhas.findIndex(r => r.some(c => /assunto/i.test(String(c))));
  if(iCab < 0) throw new Error('não achei a coluna "Assunto" na planilha');
  const col = linhas[iCab].findIndex(c => /assunto/i.test(String(c))), cont = {};
  const colM = linhas[iCab].findIndex(c => /mat[eé]ria|disciplina/i.test(String(c)));
  linhas.slice(iCab+1).forEach(r => { const mt = colM >= 0 ? String(r[colM]||'').trim() : '';
    String(r[col]||'').split(/\s*[;|]\s*|\n/).map(s=>s.trim()).filter(Boolean).forEach(a => { const k = mt + '\u0001' + a; cont[k] = (cont[k]||0)+1; }); });
  return Object.entries(cont).map(([k,q]) => { const [mt, nome] = k.split('\u0001'); return {nome, q, contexto:mt, caminho: mt ? [mt] : []}; });
}
const tecUnicasCache = {};
function tecUnicas(m){
  const freq = {}; m.topicos.forEach(t => new Set(tecTokens(t.nome)).forEach(w => freq[w] = (freq[w]||0)+1));
  return new Set(Object.keys(freq).filter(w => freq[w]===1));
}
function tecMelhorTopico(m, x){          // melhor assunto do edital dentro da matéria m, com a pontuação
  const unicas = tecUnicasCache[m.id] || (tecUnicasCache[m.id] = tecUnicas(m));
  let best = null, bp = 0;
  m.topicos.forEach(t => { const p = tecPontuar(x, t, unicas); if(p > bp){ bp = p; best = t; } });
  if(bp < .45 && x.contexto){ // tenta com o nome do grupo (ex.: "Polissemia" dentro de "Semântica")
    const grupos = (x.caminho||[]).filter(g => !tecMateriaPorNome(g)), perto = grupos[grupos.length-1];
    [perto, x.contexto].filter(Boolean).forEach(c =>
      m.topicos.forEach(t => { const p = 0.8*tecPontuar(x, t, unicas, x.nome+' '+c); if(p > bp){ bp = p; best = t; } }));
  }
  return {t: best, p: bp};
}
function tecMateriaPorNome(nome){        // "Língua Portuguesa (Português)" → Língua Portuguesa
  const A = tecTokens(nome); if(!A.length) return null;
  let melhor = null, mp = 0;
  S.materias.forEach(m => { const B = tecTokens(m.nome); if(!B.length) return;
    const cobA = A.filter(w => B.some(b => tecParecidas(w,b))).length / A.length;
    const cobB = B.filter(b => A.some(w => tecParecidas(w,b))).length / B.length;
    const p = cobB >= .99 ? (cobA + cobB) / 2 : cobB * cobA;
    if(p > mp){ mp = p; melhor = m; } });
  return mp >= .6 ? melhor : null;
}
function tecCruzar(materiaId, itens, origem){
  if(!itens.length) return;

  const unica = materiaId && materiaId !== '*' ? mat(materiaId) : null;
  itens.forEach(x => {
    let m = unica;
    if(!m) for(const g of (x.caminho||[])){ m = tecMateriaPorNome(g); if(m) break; }
    let r = m ? tecMelhorTopico(m, x) : {t:null, p:0};
    if(!unica && r.p < .4){ // grupo sem nome de matéria reconhecível: procura em todas as matérias
      S.materias.forEach(mm => { const rr = tecMelhorTopico(mm, x); if(rr.p > r.p + .05 && rr.p >= (m ? .7 : .5)){ r = rr; m = mm; } });

function estPontuarCurso(m, c){

  const nome = A.length ? A.filter(w => B.some(b => tecParecidas(w, b))).length / A.length : 0;

  const extra = /reta final|bizu|resumo|simulado|revis[aã]o|quest[oõ]es comentadas|discursiv|mapas? mentais|curso regular/i.test(c.titulo) ? -.3 : 0;

// Link direto na área do aluno do Estratégia: a aula do assunto, o curso da matéria ou, sem curso definido, "Minhas Matrículas"
const EST_BASE = 'https://www.estrategiaconcursos.com.br/app/dashboard/cursos';
function linkEstrategia(m, t){
  if(!m || !m.estCurso) return EST_BASE;
  const n = t && (String(t.aula||'').match(/\d+/) || [])[0], aula = n != null && m.estAulas ? m.estAulas[String(+n).padStart(2,'0')] : null;
  return `${EST_BASE}/${m.estCurso}/aulas` + (aula ? '/' + aula : '');
}
function setMatEstLink(id, v){
  const m = mat(id); v = v.trim();

  const e = parseEstrategia(v);
  if(!/estrategiaconcursos\.com\.br/i.test(v) || !e.id){ avisar('Cole o link do curso na área do aluno do Estratégia (ex.: https://www.estrategiaconcursos.com.br/app/dashboard/cursos/370448/aulas).'); render(); return; }

  save(); render();
}
function setMatCurso(id,v){ mat(id).curso = v.trim(); save(); render(); }
function setMatLink(id,v){ v = v.trim(); if(v && !/^https:\/\/(www\.)?tecconcursos\.com\.br\//i.test(v)){ avisar('Use um link do TEC Concursos (https://www.tecconcursos.com.br/...).'); render(); return; } mat(id).tecLink = v; save(); render(); }
function setMat(id,k,v){const m=mat(id); if(k!=='nome') v=Math.min(5,Math.max(1,v||1)); m[k]=v; save(); render();}
function setTop(mid,tid,k,v){const t=topico(mat(mid),tid); t[k]=v; if(k==='status'&&v==='nao') t.feitos=0; save(); render();}
function addMat(){const n=nm.value.trim(); if(!n) return; const m={id:uid(),nome:n,peso:3,nivel:3,curso:'',topicos:[]}; S.materias.push(m); abertas.add(m.id); save(); render();}
function addTop(mid){const i=document.getElementById('nt_'+mid), n=i.value.trim(); if(!n) return; mat(mid).topicos.push({id:uid(),nome:n,status:'nao',incid:2,paginas:0,feitos:0,aula:''}); abertas.add(mid); save(); render(); document.getElementById('nt_'+mid).focus();}
async function delTop(mid,tid){if(!(await confirmar('Excluir assunto e seu histórico?')))return; const m=mat(mid); m.topicos=m.topicos.filter(t=>t.id!==tid); S.revisoes=S.revisoes.filter(r=>r.topicoId!==tid); S.sessoes=S.sessoes.filter(s=>s.topicoId!==tid); save(); render();}
async function delMat(id){if(!(await confirmar('Excluir a matéria e todo o seu histórico?')))return; S.materias=S.materias.filter(m=>m.id!==id); S.sessoes=S.sessoes.filter(s=>s.materiaId!==id); S.revisoes=S.revisoes.filter(r=>r.materiaId!==id); save(); render();}
function importar(texto, silencioso){
  let atual=null, nM=0, nT=0, nU=0;
  (texto ?? imp.value).split('\n').forEach(l => {
    l = l.trim(); if(!l || l.startsWith('//')) return;
    if(l.startsWith('@')){ const [k,...v] = l.slice(1).split(':'); const val = v.join(':').trim();
      if(k.trim()==='concurso') S.config.concurso = val; if(k.trim()==='banca') S.config.banca = val;
      if(k.trim()==='tec' && atual && /^https:\/\/(www\.)?tecconcursos\.com\.br\//i.test(val)) atual.tecLink = val;
      if(k.trim()==='tecgeral' && /^https:\/\/(www\.)?tecconcursos\.com\.br\//i.test(val)) S.config.tecLinkGeral = val;
      if(k.trim()==='estrategia' && atual){ const e = parseEstrategia(val); if(e.id){ atual.estCurso = e.id; atual.estAulas = e.aulas; } }
      return; }
    if(/^[-•*]/.test(l)){
      if(!atual) return;
      let nome = l.replace(/^[-•*]\s*/,''), incid = null, pag = null, aula = null, mm;
      if((mm = nome.match(/\[([^\]]*)\]/))){ aula = mm[1].trim(); nome = nome.replace(mm[0],''); }
      if((mm = nome.match(/#\s*(\d+)/))){ pag = +mm[1]; nome = nome.replace(mm[0],''); }
      if((mm = nome.match(/\*\s*([123])(?!\d)/))){ incid = +mm[1]; nome = nome.replace(mm[0],''); }
      let tecQ = null; if((mm = nome.match(/%\s*(\d+)\s*$/))){ tecQ = +mm[1]; nome = nome.replace(mm[0],''); }
      nome = nome.replace(/\s+/g,' ').trim(); if(!nome) return;
      const ex = atual.topicos.find(t=>t.nome.toLowerCase()===nome.toLowerCase());
      if(ex){ if(incid) ex.incid=incid; if(pag!=null) ex.paginas=pag; if(aula!=null) ex.aula=aula; if(tecQ!=null) ex.tecQ=tecQ; nU++; }
      else { const nt = {id:uid(),nome,status:'nao',incid:incid||2,paginas:pag||0,feitos:0,aula:aula||''}; if(tecQ!=null) nt.tecQ = tecQ; atual.topicos.push(nt); nT++; }
    } else {
      const [nome,peso,nivel,curso] = l.replace(/^#+\s*/,'').split('|').map(x=>x.trim());
      if(!nome) return;
      atual = S.materias.find(m=>m.nome.toLowerCase()===nome.toLowerCase());
      const c = v => Math.min(5,Math.max(1,+v||3));
      if(!atual){ atual={id:uid(),nome,peso:c(peso),nivel:c(nivel),curso:curso||'',topicos:[]}; S.materias.push(atual); nM++; }
      else { if(peso) atual.peso=c(peso); if(nivel) atual.nivel=c(nivel); if(curso) atual.curso=curso; }
    }
  });
  save(); const msg = `${nM} matérias novas, ${nT} assuntos novos, ${nU} assuntos atualizados.`; if(!silencioso) avisar('Importado: '+msg); render(); return msg;
}

/* ---------- Desempenho ---------- */
// Onde focar: peso do assunto na prova (frequência nos cadernos do TEC, ou a incidência) × peso da matéria × seu desempenho
function prioridades(){
  const maxPeso = Math.max(1, ...S.materias.map(m => +m.peso||1)), L = lim(), out = [];
  S.materias.forEach(m => {
    const usaTec = m.topicos.some(t => t.tecQ != null);
    const base = t => usaTec ? (+t.tecQ||0) : ({1:1, 2:2, 3:4}[t.incid||2]);
    const soma = m.topicos.reduce((s,t)=>s+base(t),0) || 1;
    m.topicos.forEach(t => {
      const share = base(t)/soma, ix = indice(t.id);
      let f = ix.p == null ? 1 : 1 + Math.max(0, L - ix.p) * 2.5;
      if(t.status==='concluido' && ix.p != null && ix.p >= L) f *= .25;
      out.push({m, t, share, usaTec, p: ix.p, q: ix.q, score: share * ((+m.peso||1)/maxPeso) * f});
    });
  });
  return out.sort((a,b) => b.score - a.score);
}
function cardPrioridades(n){
  const pr = prioridades().slice(0, n||12); if(!pr.length) return '';
  const temTec = S.materias.some(m => m.topicos.some(t => t.tecQ != null));
  return `<div class="card"><h2>Onde focar</h2><p class="mut" style="margin-top:-4px">Assuntos que mais pesam na prova${temTec ? ' pela frequência nos cadernos do TEC' : ' pela incidência do edital'}, considerando o peso da matéria e o seu acerto. O planejamento dá mais tempo e questões a eles.${temTec ? '' : ' Importe os cadernos do Guia do TEC (tela Edital) para usar a frequência real.'}</p>
    <div style="overflow-x:auto"><table><tr><th>#</th><th>Assunto</th><th class="n">${temTec?'% no TEC':'Incidência'}</th><th class="n">Seu acerto</th><th>Situação</th></tr>
    ${pr.map((x,i) => `<tr><td>${i+1}</td><td>${esc(curto(x.t.nome,60))}<div class="mut" style="font-size:13.5px">${esc(x.m.nome)}</div></td>
      <td class="n">${x.usaTec ? pct(x.share) : INCID[x.t.incid||2]}</td><td class="n">${x.p==null?'<span class="mut">—</span>':`<span class="tag ${corP(x.p)}">${pct(x.p)}</span> <span class="mut" style="font-size:13.5px">${x.q}q</span>`}</td>
      <td>${x.t.status==='concluido' ? (x.p!=null && x.p<lim() ? '<span class="tag warn">revisar</span>' : '<span class="tag ok">concluído</span>') : x.t.status==='estudando' ? '<span class="tag">estudando</span>' : '<span class="mut">a estudar</span>'}</td></tr>`).join('')}</table></div></div>`;
}

    <p class="mut">Índice = acerto ponderado pela recência (as sessões mais novas pesam mais).</p></div>

/* ---------- Meu plano (horários, pausas, data final, ciclo, assuntos estudados e rever assuntos) ---------- */
let avisoPlano = '', simData = null, pausaForm = null;
function refazerPendentes(msg){ if(S.materias.length) gerarMetas(true); avisoPlano = msg; save(); render(); }
function setHoraDia(d, v){
  if(!Array.isArray(S.config.horasDia)) S.config.horasDia = [0,1,2,3,4,5,6].map(horasPadraoDia);
  S.config.horasDia[d] = Math.max(0, Math.min(16, +v||0)); simData = null;
  refazerPendentes('Horários atualizados: '+hm(minSemana())+' líquidas por semana. Metas pendentes de hoje e cronograma recalculados.');
}
function usarHorasSimples(){ S.config.horasDia = null; simData = null; refazerPendentes('Voltou a usar só “dia útil” e “fim de semana” (em Configurações).'); }
function addPausa(){
  const de = document.getElementById('pz_de').value, ate = document.getElementById('pz_ate').value, motivo = document.getElementById('pz_mot').value.trim();
  if(!de || !ate) return avisar('Informe o primeiro e o último dia da pausa.');
  if(ate < de) return avisar('O último dia não pode ser antes do primeiro.');
  if(ate < hoje()) return avisar('Essa pausa já passou. Escolha datas a partir de hoje.');
  if((S.config.pausas||[]).some(p => !(ate < p.de || de > p.ate))) return avisar('Já existe uma pausa nesse período.');
  S.config.pausas.push({id:uid(), de, ate, motivo, criada:hoje()}); S.config.pausas.sort((a,b)=>a.de<b.de?-1:1); pausaForm = null;
  if(de <= hoje()) S.metas[hoje()] = (S.metas[hoje()]||[]).filter(x => x.feita);
  refazerPendentes(`Pausa de ${br(de)} a ${br(ate)} cadastrada (${diff(de,ate)+1} dia${diff(de,ate)?'s':''}). Nesses dias não há metas; o conteúdo segue depois, e as revisões vencidas entram primeiro na volta.`);
}
async function delPausa(id){
  const p = S.config.pausas.find(x=>x.id===id); if(!p) return;
  if(!(await confirmar(`Remover a pausa de ${br(p.de)} a ${br(p.ate)}? As metas voltam a ser geradas nesses dias.`))) return;
  S.config.pausas = S.config.pausas.filter(x=>x.id!==id);
  if(p.de <= hoje() && hoje() <= p.ate) delete S.metas[hoje()];
  refazerPendentes('Pausa removida.');
}
async function encerrarPausa(id){
  const p = S.config.pausas.find(x=>x.id===id); if(!p) return;
  if(!(await confirmar('Encerrar a pausa hoje e voltar a estudar já?'))) return;
  p.ate = addDias(hoje(), -1); if(p.ate < p.de) S.config.pausas = S.config.pausas.filter(x=>x.id!==id);
  delete S.metas[hoje()]; refazerPendentes('Pausa encerrada. As metas de hoje foram montadas.');
}
// Terminar até uma data: soma 30 min por vez aos dias em que você já estuda; se não bastar, também aos outros dias (máx. 12 h/dia)
function simularData(){
  const alvo = document.getElementById('sd_data').value; if(!alvo) return avisar('Escolha a data.');
  if(alvo <= hoje()) return avisar('Escolha uma data futura.');
  const rest = conteudoRestante(); if(!rest){ simData = {alvo, ok:true, horas:[0,1,2,3,4,5,6].map(horasDoDia), atual:hoje(), nada:true}; render(); return; }
  const base = [0,1,2,3,4,5,6].map(horasDoDia), atual = dataTermino(rest);
  const h = base.slice(), fn = d => h[d];
  let fim = dataTermino(rest, fn), passos = 0;
  const ativos = [0,1,2,3,4,5,6].filter(d => base[d] > 0);
  while((!fim || fim > alvo) && passos++ < 400){
    const grupo = ativos.filter(d => h[d] < 12).length ? ativos.filter(d => h[d] < 12) : [0,1,2,3,4,5,6].filter(d => h[d] < 12);
    if(!grupo.length) break;
    const d = grupo.sort((a,b)=>h[a]-h[b])[0]; h[d] = +(h[d] + .5).toFixed(1);
    fim = dataTermino(rest, fn);
  }
  simData = {alvo, ok: !!fim && fim <= alvo, horas:h, fim, atual, rest, base};
  render();
}
function aplicarSim(){ if(!simData) return; S.config.horasDia = simData.horas.slice(); if(!S.config.dataProva) S.config.dataProva = simData.alvo; simData = null;
  refazerPendentes('Novos horários aplicados: '+hm(minSemana())+' líquidas por semana. O cronograma já segue esses horários.'); }
function moverMat(id, dir){
  const i = S.materias.findIndex(m=>m.id===id), j = i+dir; if(i<0 || j<0 || j>=S.materias.length) return;
  [S.materias[i], S.materias[j]] = [S.materias[j], S.materias[i]];
  refazerPendentes(+S.config.materiasPorVez ? 'Ordem do ciclo alterada. As metas pendentes de hoje seguem a nova ordem.' : 'Ordem das matérias alterada.');
}
function setPorVez(v){ S.config.materiasPorVez = +v||0; refazerPendentes(+v ? `Ciclo com ${v} matéria${v>1?'s':''} por vez. Quando uma acaba, a próxima da lista entra no lugar.` : 'Ciclo com todas as matérias ao mesmo tempo.'); }
function marcarEstudados(){
  const ids = [...document.querySelectorAll('input[data-est]:checked')].map(x=>x.dataset.est), rev = document.getElementById('me_rev').checked;
  if(!ids.length) return avisar('Marque pelo menos um assunto.');
  let n = 0;
  S.materias.forEach(m => m.topicos.forEach(t => { if(!ids.includes(t.id)) return;
    t.status = 'concluido'; t.feitos = blocosTopico(m,t).length; t.estudadoFora = hoje(); if(rev) agendarPrimeira(m.id, t.id); n++; }));
  S.metas[hoje()] = (S.metas[hoje()]||[]).filter(x => x.feita || !(ids.includes(x.topicoId) && (x.tipo==='conteudo' || x.tipo==='extra')));
  refazerPendentes(`${n} assunto${n>1?'s':''} marcado${n>1?'s':''} como já estudado${n>1?'s':''}.${rev?' A primeira revisão de cada um foi agendada.':''} O tempo deles saiu do cronograma.`);
}
function reverAssuntos(){
  const ids = [...document.querySelectorAll('input[data-rev]:checked')].map(x=>x.dataset.rev);
  if(!ids.length) return avisar('Marque pelo menos um assunto para rever.');
  let n = 0;
  S.materias.forEach(m => m.topicos.forEach(t => { if(!ids.includes(t.id)) return; t.status = 'estudando'; t.feitos = 0; t.revisto = (t.revisto||0)+1; n++; }));
  refazerPendentes(`${n} assunto${n>1?'s':''} ${n>1?'voltaram':'voltou'} para o cronograma: teoria e questões de novo, na vez da matéria no ciclo. As revisões já agendadas continuam.`);
}

  h += `<div class="grid" style="margin-top:16px"><div class="card"><h2>Atividades fixas</h2><p class="mut" style="margin-top:-4px">Atividades que se repetem e entram primeiro no dia, como Lei Seca 30 min por dia ou caderno de erros no domingo. Elas usam as suas horas líquidas, e o ciclo divide só o tempo que sobra.</p>

    <div class="row"><div><label for="fx_n">Atividade</label><input id="fx_n" placeholder="Ex.: Lei Seca"></div><div><label for="fx_m">Minutos</label><input id="fx_m" type="number" min="10" step="5" value="30"></div>
      <div><label for="fx_mat">Matéria (opcional)</label><select id="fx_mat"><option value="">—</option>${S.materias.map(m=>`<option value="${m.id}">${esc(curto(m.nome,40))}</option>`).join('')}</select></div></div>
    <div class="inl">${DS.map((d,i)=>`<label style="display:inline-flex;gap:4px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" class="fx_d" value="${i}" ${i>0&&i<6?'checked':''} style="width:auto">${d}</label>`).join('')}</div>
    <div class="inl"><button class="b" onclick="addFixa()">Adicionar</button><button class="lk" onclick="document.getElementById('fx_n').value='Lei Seca';document.getElementById('fx_m').value=30">sugestão: Lei Seca 30 min</button><button class="lk" onclick="document.getElementById('fx_n').value='Revisão do caderno de erros';document.getElementById('fx_m').value=60;document.querySelectorAll('.fx_d').forEach(x=>x.checked=x.value==='0')">sugestão: caderno de erros no domingo</button></div></div>
    <div class="card"><h2>Meta semanal de questões</h2><p class="mut" style="margin-top:-4px">Quantas questões você quer resolver por semana. O Painel mostra quanto falta.</p>
    <label for="cfg_metaq">Questões por semana</label><input id="cfg_metaq" type="number" min="0" step="10" value="${+c.metaQSemana||0}" onchange="S.config.metaQSemana=+this.value||0;save();render()">
    <p class="mut">Use 0 para esconder a meta.</p></div></div>`;
  // assuntos já estudados e rever
  const aEstudar = S.materias.map(m=>({m, ts:m.topicos.filter(t=>t.status!=='concluido')})).filter(x=>x.ts.length);
  const concl = []; S.materias.forEach(m=>m.topicos.forEach(t=>{ if(t.status==='concluido'){ const ix = indice(t.id); concl.push({m,t,p:ix.p,q:ix.q}); } }));
  concl.sort((a,b)=>(a.p??2)-(b.p??2));
  h += `<div class="grid" style="margin-top:16px"><div class="card"><h2>Sinalizar assuntos já estudados</h2><p class="mut" style="margin-top:-4px">Já estudou algum assunto antes (outro curso, outro concurso)? Marque aqui: ele sai do estudo teórico do cronograma e conta no progresso.</p>
    ${aEstudar.map(({m,ts})=>`<details class="mat" ${planoAberto.has('e'+m.id)?'open':''} ontoggle="this.open?planoAberto.add('e${m.id}'):planoAberto.delete('e${m.id}')"><summary><b style="flex:1">${esc(m.nome)}</b><span class="mut">${ts.length} a estudar</span></summary><div class="body">
      ${ts.map(t=>`<label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:15.5px;margin:6px 0"><input type="checkbox" data-est="${t.id}" style="width:17px;height:17px;flex:none;margin-top:2px;accent-color:var(--acc)">${esc(t.nome)}${t.status==='estudando'?' <span class="tag">estudando</span>':''}</label>`).join('')}</div></details>`).join('') || '<div class="empty">Todos os assuntos já estão concluídos.</div>'}
    ${aEstudar.length?`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:10px"><input id="me_rev" type="checkbox" checked style="width:17px;height:17px;accent-color:var(--acc)">Agendar as revisões desses assuntos (recomendado)</label>
    <div class="inl"><button class="b" onclick="marcarEstudados()">Marcar como estudados</button></div>`:''}</div>
    <div class="card"><h2>Rever assuntos</h2><p class="mut" style="margin-top:-4px">Traz de volta ao cronograma um assunto que você já concluiu, com teoria e questões de novo. A lista começa pelos de menor acerto.</p>
    ${concl.length ? `<div style="max-height:420px;overflow:auto"><table><tr><th></th><th>Assunto</th><th class="n">Acerto</th></tr>${concl.map(x=>`<tr><td><input type="checkbox" data-rev="${x.t.id}" style="width:17px;height:17px;accent-color:var(--acc)" aria-label="Rever ${esc(x.t.nome)}"></td>
      <td>${esc(curto(x.t.nome,70))}<div class="mut" style="font-size:13.5px">${esc(x.m.nome)}${x.t.estudadoFora?' · marcado como já estudado':''}${x.t.revisto?' · revisto '+x.t.revisto+'x':''}</div></td><td class="n">${x.p==null?'<span class="mut">—</span>':`<span class="tag ${corP(x.p)}">${pct(x.p)}</span>`}</td></tr>`).join('')}</table></div>
      <div class="inl"><button class="b" onclick="reverAssuntos()">Trazer de volta ao cronograma</button></div>` : '<div class="empty">Nenhum assunto concluído ainda.</div>'}</div></div>`;
  return h;
}

/* ---------- Cadernos de anotações por matéria ---------- */
let cadMat = null, cadT = null;
const CAD_MAX = 60000;
function abrirCaderno(mid){ cadMat = mid; ir('cadernos'); }
function editarCaderno(v){
  if(v.length > CAD_MAX){ v = v.slice(0, CAD_MAX); avisar('O caderno chegou ao limite de '+CAD_MAX.toLocaleString('pt-BR')+' caracteres. Baixe uma cópia e comece um resumo novo.'); }
  S.cadernos[cadMat] = v; const el = document.getElementById('cad_n'); if(el) el.textContent = v.length.toLocaleString('pt-BR')+' caracteres';
  clearTimeout(cadT); cadT = setTimeout(save, 800);
}
async function baixarTexto(nome, txt){
  if(ONLINE){ let dl = null; try{ dl = await window.claude.use('downloads'); }catch(e){}
    if(dl){ try{ await dl.save({filename:nome, data:txt}); }catch(e){ if(e.code!=='declined') avisar('Não foi possível baixar ('+(e.code||e.message)+').'); } return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})); a.download = nome; a.click();
}
const nomeArq = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || 'caderno';
function baixarCaderno(mid){ const m = mat(mid); if(!m) return; baixarTexto('caderno-'+nomeArq(m.nome)+'.txt', m.nome+'\n'+'='.repeat(Math.min(60,m.nome.length))+'\n\n'+(S.cadernos[mid]||'')); }
function baixarTodosCadernos(){
  const txt = S.materias.filter(m=>(S.cadernos[m.id]||'').trim()).map(m => m.nome+'\n'+'='.repeat(Math.min(60,m.nome.length))+'\n\n'+S.cadernos[m.id]).join('\n\n\n');
  if(!txt) return avisar('Os cadernos ainda estão vazios.');
  baixarTexto('cadernos-'+hoje()+'.txt', txt);
}
function inserirNoCaderno(){
  const ta = document.getElementById('cad_txt'); if(!ta) return;
  const marca = `\n— ${br(hoje())} —\n`; const i = ta.selectionStart ?? ta.value.length;
  ta.value = ta.value.slice(0,i) + marca + ta.value.slice(i); ta.focus(); ta.selectionStart = ta.selectionEnd = i + marca.length; editarCaderno(ta.value);
}
function vCadernos(){
  if(!S.materias.length) return vazio();
  if(!cadMat || !mat(cadMat)) cadMat = S.materias[0].id;
  const m = mat(cadMat), txt = S.cadernos[cadMat] || '';
  return `<div class="g2"><div class="col"><div class="card"><h2>Caderno de ${esc(m.nome)} <span class="inl" style="margin:0"><button class="g" onclick="inserirNoCaderno()">+ Data de hoje</button><button class="g" onclick="baixarCaderno('${m.id}')">Baixar</button></span></h2>
    <p class="mut" style="margin-top:-4px">Anote os pontos importantes, as pegadinhas da banca e o que errou nas questões. Fica salvo sozinho e serve de base para os resumos e as revisões.</p>
    <textarea id="cad_txt" style="min-height:440px;font-family:inherit;font-size:15.5px;line-height:1.55" placeholder="Ex.: Crase antes de “Vossa Senhoria”: nunca. A banca costuma trocar ‘sempre’ por ‘nunca’…" oninput="editarCaderno(this.value)">${esc(txt)}</textarea>
    <div class="mut" style="margin-top:6px"><span id="cad_n">${txt.length.toLocaleString('pt-BR')} caracteres</span> · salvo automaticamente</div></div></div>
    <div class="col"><div class="card"><h2>Suas matérias <button class="g" onclick="baixarTodosCadernos()">Baixar todos</button></h2>
    ${S.materias.map(mm => { const n = (S.cadernos[mm.id]||'').length;
      return `<button onclick="cadMat='${mm.id}';render()" style="display:block;width:100%;text-align:left;cursor:pointer;font:inherit;padding:9px 11px;margin:6px 0;border-radius:10px;border:${mm.id===cadMat?'2px solid var(--acc)':'1px solid var(--line)'};background:${mm.id===cadMat?'var(--acc2)':'var(--card)'};color:var(--ink)"><b style="font-size:15.5px">${esc(curto(mm.nome,44))}</b><div class="mut" style="font-size:13.5px">${n?n.toLocaleString('pt-BR')+' caracteres':'vazio'}</div></button>`; }).join('')}</div></div></div>`;
}

/* ---------- Simulados ---------- */
let simForm = false;
function salvarSimulado(){
  const nome = document.getElementById('si_nome').value.trim(), data = document.getElementById('si_data').value || hoje();
  if(!nome) return avisar('Dê um nome ao simulado (ex.: Simulado 3 – TC DF).');
  if(data > hoje()) return avisar('A data não pode ser no futuro.');
  const por = []; let erro = '';
  S.materias.forEach(m => { const q = +document.getElementById('si_q_'+m.id).value||0, a = +document.getElementById('si_a_'+m.id).value||0;
    if(a > q) erro = m.nome; if(q) por.push({materiaId:m.id, q, a}); });
  if(erro) return avisar(`Em ${erro}, os acertos passam do número de questões.`);
  let q = por.reduce((s,x)=>s+x.q,0), a = por.reduce((s,x)=>s+x.a,0);
  if(!q){ q = +document.getElementById('si_qt').value||0; a = +document.getElementById('si_at').value||0; }
  if(!q) return avisar('Informe as questões e os acertos (por matéria ou no total).');
  if(a > q) return avisar('Acertos não podem ser maiores que o número de questões.');
  const errC = +document.getElementById('si_err').value||0, min = +document.getElementById('si_min').value||0;
  const nota = document.getElementById('si_nota').value.trim();
  S.simulados.push({id:uid(), nome, data, banca:S.config.banca||'', q, a, erradas:errC, min, nota: nota===''?null:+nota.replace(',','.'), por});
  S.simulados.sort((x,y)=>x.data<y.data?-1:1); simForm = false; save(); render(); avisar(`Simulado salvo: ${a}/${q} (${pct(a/q)}).`);
}
async function delSimulado(id){ if(!(await confirmar('Excluir este simulado?'))) return; S.simulados = S.simulados.filter(s=>s.id!==id); save(); render(); }
function vSimulados(){
  if(!S.materias.length) return vazio();
  const L = S.simulados || [], ult = L[L.length-1], ant = L[L.length-2];
  const cespe = /cespe|cebraspe/i.test(S.config.banca||'');
  let h = '';
  if(L.length) h += `<div class="kpis"><div class="kpi">${anel(ult.a/ult.q,'var(--ok)',64,pct(ult.a/ult.q))}<div><div class="mut">Último simulado</div><div class="big">${ult.a}/${ult.q}</div><div class="mut">${esc(curto(ult.nome,28))} · ${br(ult.data).slice(0,5)}</div></div></div>
    <div class="kpi"><div><div class="mut">Evolução</div><div class="big">${ant?((x=>(x>0?'+':'')+x+' pp')(Math.round((ult.a/ult.q-ant.a/ant.q)*100))):'—'}</div><div class="mut">em relação ao anterior</div></div></div>
    <div class="kpi"><div><div class="mut">Média geral</div><div class="big">${pct(L.reduce((s,x)=>s+x.a,0)/L.reduce((s,x)=>s+x.q,0))}</div><div class="mut">${L.length} simulado${L.length>1?'s':''}</div></div></div>
    ${ult.nota!=null?`<div class="kpi"><div><div class="mut">Nota do último</div><div class="big">${String(ult.nota).replace('.',',')}</div><div class="mut">${cespe?'líquida (certas − erradas)':'informada por você'}</div></div></div>`:''}</div>`;
  h += `<div class="g2"><div class="col"><div class="card"><h2>${simForm?'Novo simulado':'Simulados'} ${simForm?'':`<button class="b" onclick="simForm=true;render()">+ Registrar simulado</button>`}</h2>`;
  if(simForm){
    h += `<p class="mut" style="margin-top:-4px">Faça o simulado no tempo da prova e registre o resultado. Preencha por matéria para ver onde perdeu pontos, ou só o total.</p>
    <div class="row"><div><label for="si_nome">Nome</label><input id="si_nome" placeholder="Ex.: Simulado 3 – ${esc(curto(S.config.concurso||'seu concurso',30))}"></div><div><label for="si_data">Data</label><input id="si_data" type="date" value="${hoje()}"></div></div>
    <div style="overflow-x:auto;margin-top:8px"><table><tr><th>Matéria</th><th class="n">Questões</th><th class="n">Acertos</th></tr>
      ${S.materias.map(m=>`<tr><td>${esc(curto(m.nome,50))}</td><td class="n"><input id="si_q_${m.id}" type="number" min="0" inputmode="numeric" style="width:80px"></td><td class="n"><input id="si_a_${m.id}" type="number" min="0" inputmode="numeric" style="width:80px"></td></tr>`).join('')}</table></div>
    <div class="row"><div><label for="si_qt">Total de questões (se não preencheu por matéria)</label><input id="si_qt" type="number" min="0"></div><div><label for="si_at">Total de acertos</label><input id="si_at" type="number" min="0"></div></div>
    <div class="row"><div><label for="si_err">${cespe?'Erradas (Cebraspe: uma errada anula uma certa)':'Erradas (opcional)'}</label><input id="si_err" type="number" min="0"></div><div><label for="si_nota">Nota final (opcional)</label><input id="si_nota" inputmode="decimal"></div><div><label for="si_min">Tempo (min)</label><input id="si_min" type="number" min="0"></div></div>
    <div class="inl"><button class="b" onclick="salvarSimulado()">Salvar simulado</button><button class="g" onclick="simForm=false;render()">Cancelar</button></div>`;
  } else if(L.length){
    h += `<div style="overflow-x:auto"><table><tr><th>Data</th><th>Simulado</th><th class="n">Acertos</th><th class="n">%</th><th class="n">Nota</th><th></th></tr>${L.slice().reverse().map(s=>`<tr><td>${br(s.data).slice(0,5)}</td><td>${esc(s.nome)}${s.min?`<div class="mut" style="font-size:13.5px">${hm(s.min)}</div>`:''}</td><td class="n">${s.a}/${s.q}</td><td class="n"><span class="tag ${corP(s.a/s.q)}">${pct(s.a/s.q)}</span></td><td class="n">${s.nota!=null?String(s.nota).replace('.',','):'—'}</td><td><button class="x" title="Excluir" onclick="delSimulado('${s.id}')">✕</button></td></tr>`).join('')}</table></div>`;
  } else h += `<div class="empty">Nenhum simulado registrado. Registre cada simulado que fizer para acompanhar a evolução e ver as matérias que mais tiram pontos.</div>`;
  h += `</div>`;
  if(L.length >= 1){ const ul = L.slice(-10);
    h += `<div class="card"><h2>Evolução nos simulados</h2><div class="weeks">${ul.map(s=>`<div title="${esc(s.nome)}"><span>${pct(s.a/s.q)}</span><b style="height:${s.a/s.q*100}%;background:var(--${corP(s.a/s.q)||'acc'})"></b>${br(s.data).slice(0,5)}</div>`).join('')}</div>
      <p class="mut" style="margin-bottom:0">Linha do seu limiar: ${S.config.limiar}%. Barras em verde estão acima dele.</p></div>`; }
  h += `</div><div class="col"><div class="card"><h2>Por matéria</h2>`;
  const agg = {}; L.forEach(s => (s.por||[]).forEach(x => { const g = agg[x.materiaId] = agg[x.materiaId] || {q:0,a:0,ult:null}; g.q += x.q; g.a += x.a; g.ult = x; }));
  const linhas = S.materias.filter(m=>agg[m.id]).map(m=>({m, ...agg[m.id], p: agg[m.id].a/agg[m.id].q})).sort((a,b)=>a.p-b.p);
  h += linhas.length ? linhas.map(x=>`<div class="brow"><span>${esc(curto(x.m.nome,24))}<div class="mut">${x.a}/${x.q} · último ${pct(x.ult.a/x.ult.q)}</div></span><div class="bar"><i class="${corP(x.p)}" style="width:${x.p*100}%"></i></div><span>${pct(x.p)}</span></div>`).join('')
    + `<p class="mut" style="margin-bottom:0">As matérias de cima são as que mais tiram pontos nos simulados: confira o “Onde focar” em Desempenho e os reforços nas metas.</p>`
    : '<div class="empty">Preencha os simulados por matéria para ver onde você perde pontos.</div>';
  h += `</div></div></div>`;
  return h;
}

/* ---------- Tema claro/escuro ---------- */
function aplicarTema(t){ if(t==='claro'||t==='escuro') document.documentElement.dataset.theme = t==='claro'?'light':'dark'; else delete document.documentElement.dataset.theme; }
function temaAtual(){ try{ return localStorage.getItem('eg-tema') || 'auto'; }catch(e){ return 'auto'; } }
function trocarTema(){ const ord = ['auto','claro','escuro'], t = ord[(ord.indexOf(temaAtual())+1)%3]; try{ localStorage.setItem('eg-tema', t); }catch(e){} aplicarTema(t); window.__tema = t; render(); }
aplicarTema(temaAtual());

/* ---------- Constância: semana com ✓ e dias estudados ---------- */
// Primeiro nome de quem está usando: conta Google do site ou o nome informado em Configurações
function nomeUsuario(){
  const n = (S.config.nome || (ONLINE && ONLINE.usuario && ONLINE.usuario.nome) || '').trim();
  return n.split(/\s+/)[0] || '';
}
function alternarNoite(){ const tm = temaAtual(), escuro = tm==='escuro' || (tm==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const t = escuro ? 'claro' : 'escuro'; try{ localStorage.setItem('eg-tema', t); }catch(e){} aplicarTema(t); render(); }
function diasEstudados(){ return new Set(S.sessoes.filter(s=>(+s.min||0)>0 || (+s.q||0)>0).map(s=>s.data)).size; }
function semanaChecks(){
  const ini = addDias(hoje(), -parse(hoje()).getDay()), dias = new Set(S.sessoes.map(s=>s.data));
  return `<div style="display:flex;gap:6px;margin-top:10px">${[0,1,2,3,4,5,6].map(i=>{ const d = addDias(ini,i), ok = dias.has(d), fut = d > hoje(), pz = pausaDe(d);

}

/* ============ Lei seca: leitura do texto da lei ============
   leiDoTexto(texto) recebe o texto de uma lei (do catálogo, do site oficial ou de um PDF)
   e devolve {arts:[{k, rot, tit, h, d:[{r, t}]}]}: cada artigo com caput, parágrafos, incisos, alíneas e penas.
   Tira as anotações de alteração ("Redação dada pela…", "Incluído pela…"), dispositivos revogados e vetados. */
const LEI_ANOT = /\s*\((?=[^()]{0,12}(?:reda[çc][ãa]o|inclu[íi]d|acrescid|acrescentad|vide|revogad|renumerad|regulament|vig[êe]ncia|produ[çc][ãa]o de efeito|express[ãa]o|declarad|suspens|execu[çc][ãa]o|promulga|alterad|transformad|retificad|restabelecid|mantid|nova reda|com reda|em vigor|efeitos|convers[ãa]o|na reda|vetad|ver\b|partes? mantid|texto|revoga[çc][ãa]o|adi\b|adc\b|adpf|ac[óo]rd[ãa]o|decis[ãa]o|ef[ií]c[áa]cia|atualizad|reproduzid|publica[çc][ãa]o|medida provis|prov\.|provs?\b|provimento|comunicado|dlc\b|lei n|leis n|decreto n|ec n|emenda constitucional|vide ))(?:[^()]|\([^()]*\))*\)/gi;
const LEI_INICIO = /^(?:Art(?:igo)?|ARTIGO)\.?\s*(\d{1,2}(?:\.\d{3})+|\d+)\s*(?:º|°|o(?=[\s.\-–—])|ª)?\s*(?:-([A-Z]{1,3})(?![a-zà-úA-Z]))?\s*[.\-–—:]?\s*/;
const LEI_DISP = [
  [/^(§\s*\d+(?:\.\d{3})?\s*(?:º|°|o\b)?(?:-[A-Z]{1,3})?)\.?\s*[-–—.]?\s*/, m => m[1].replace(/\s+/g,'').replace('§','§ ').replace(/(\d)(?:°|o\b)/,'$1º')],
  [/^(Par[áa]grafo [úu]nico)\s*[.\-–—:]?\s*/i, () => 'Parágrafo único'],
  [/^((?:[IVXLC]{1,7}))\s*[-–—]\s*/, m => m[1]],
  [/^((?:[IVXLC]{1,7}))\.\s+(?=[a-zà-ú])/, m => m[1]],
  [/^([a-z])\)\s*/, m => m[1]+')'],
  [/^(\d{1,2})\)\s*/, m => m[1]+')'],
  [/^(\d{1,2})\.\s+(?=[A-ZÀ-Ú])/, m => m[1]+'.'],
  [/^(Pena)\s*[-–—:]\s*/i, () => 'Pena'],
];
const LEI_CAB = /^(PARTE|LIVRO|T[ÍI]TULO|CAP[ÍI]TULO|SE[ÇC][ÃA]O|SUBSE[ÇC][ÃA]O|Parte|Livro|T[íi]tulo|Cap[íi]tulo|Se[çc][ãa]o|Subse[çc][ãa]o)\s+([IVXLCDM]+\b|[ÚU]NIC[OA]\b|[Úú]nic[oa]\b|\d+\b|GERAL\b|ESPECIAL\b|PRELIMINAR\b|Geral\b|Especial\b|Preliminar\b)/;
const LEI_NIVEL = {parte:0, livro:1, titulo:2, capitulo:3, secao:4, subsecao:5};
const LEI_FIM = /^(?:(?:Bras[íi]lia|Rio de Janeiro|S[ãa]o Paulo|Pal[áa]cio dos Bandeirantes|Pal[áa]cio do Buriti|Pal[áa]cio do Planalto)\b.{0,40}\d{4}|Este texto n[ãa]o substitui|\*+$|Download para anexo|Texto para impress[ãa]o)/i;
const leiNum = s => +String(s).replace(/\./g,'');
// chave de ordenação: 313 < 313-A < 313-B < 314
const leiOrdem = k => { const m = String(k).match(/^(?:(ADCT)\s+)?(\d+)(?:-([A-Z]{1,3}))?$/); if(!m) return 1e9;
  let suf = 0; if(m[3]) for(const ch of m[3]) suf = suf*27 + (ch.charCodeAt(0)-64);
  return (m[1] ? 1e6 : 0) + +m[2] + suf/1000; };
function leiLimpar(s, pdf){
  s = String(s).replace(/­/g,'').replace(/[  -​]/g,' ');
  s = s.replace(LEI_ANOT, '');
  s = s.replace(/\s*\(NR\)/g, '').replace(/\s+-\s+Vide\b[^]*$/i, '').replace(/\s+-\s+(?:["“]?Caput["”]?|Artigo|Art\.|Par[áa]gr[áa]fo|Inciso|Al[íi]nea|§|Item|Se[çc][ãa]o|Cap[íi]tulo|T[íi]tulo)[^]{0,80}?(?:com reda[çc][ãa]o|acrescentad|inclu[íi]d|revogad|renumerad|alterad)[^]*$/i, '');
  if(pdf) s = s.replace(/([.;:!?”"])\d{1,3}$/, '$1');
  s = s.replace(/\s+/g,' ').replace(/\s+([,.;:])/g,'$1').trim();
  while(/\)$/.test(s) && (s.match(/\)/g)||[]).length > (s.match(/\(/g)||[]).length) s = s.slice(0,-1).trim();
  return s;
}
const leiVazio = t => !t || /^[\s.;:,\-–—]*$/.test(t) || /^\(?\s*(?:revogad[oa]s?|vetad[oa]s?|suprimid[oa]s?|prejudicad[oa])\b[^]*$/i.test(t) && t.length < 120;
function leiDoTexto(texto, opc){
  opc = opc || {};
  const pdf = !!opc.pdf;
  let linhas = String(texto).replace(/\r/g,'').split('\n').map(l => l.replace(/\s+/g,' ').trim()).filter(Boolean);
  if(opc.inicio){ const re = new RegExp(opc.inicio, 'i'); const i = linhas.findIndex(l => re.test(l)); if(i >= 0) linhas = linhas.slice(i+1); }
  const arts = [], vistos = new Set(), cab = [];
  let art = null, disp = null, pular = true, prefixo = '', cabAberto = -1, ultimoCab = '', rubrica = '';
  const hAtual = () => cab.filter(Boolean).join(' › ');
  const fecharDisp = () => { if(disp){ disp.t = leiLimpar(disp.t, pdf); if(leiVazio(disp.t)) art.d.splice(art.d.indexOf(disp), 1); disp = null; } };
  const fecharArt = () => { if(!art) return; fecharDisp(); art.d = art.d.filter(x => !leiVazio(x.t));
    if(art.d.length && !vistos.has(art.k)){ vistos.add(art.k); arts.push(art); } art = null; };
  for(let i = 0; i < linhas.length; i++){
    let l = linhas[i];
    if(pdf){ if(/^\d{1,4}$/.test(l)) continue;
      if(l.length < 90 && /^(?:Provs?\.\s|Prov\.?\s*C\.?G|DLC\b|Comunicado\b|Com\.\s*C|Res\.\s|Port\.\s|Portaria\b|Provimento\b|Ato Normativo\b|Assento\b|Ac[óo]rd[ãa]o\b)/i.test(l)) continue;
      if(l.length < 130 && /^(?:\d{1,2}\s+)?(?:Provs?\.?\s|Res\.\s|CJE\b|L\.\s*\d|D\.\s*\d|DL\s|Dec\.\s|Vide\s|CPP,|CPC,|CP,|CF,|CC,|LOMAN|Lei n[º°o]|Lei Federal|Lei Estadual|Portaria\b|Comunicado\b|Prov\s+C)/.test(l) && /\d{2,4}\.?$|art\.\s*\d+[º°]?\.?$/i.test(l)) continue;
      if(l.length < 70 && /^(?:Lei|Decreto|LC|Resolu[çc][ãa]o|Res\.|Lei Complementar|CF|CPC|CPP)\b[^a-z]{0,45}\d{2,4}\.?$/i.test(l)) continue; }
    if(/^\*?(Mensagem de veto|Vig[êe]ncia|Regulamento|Texto compilado|Convers[ãa]o da Medida|Vide\b|\(Vide)/i.test(l) && l.length < 160 && !art) continue;
    if(/ATO DAS DISPOSI[ÇC][ÕO]ES CONSTITUCIONAIS TRANSIT[ÓO]RIAS/i.test(l) && l.length < 80 && (arts.length || art)){ fecharArt(); prefixo = 'ADCT '; cab.length = 0; cab[0] = 'ADCT'; pular = false; continue; }
    if(LEI_FIM.test(l)){ fecharArt(); pular = true; continue; }
    const c = l.match(LEI_CAB);
    if(c && l.length < 160 && /^\s*($|[-–—.:]|[A-ZÀ-Ú])/.test(l.slice(c[0].length))){
      fecharArt();
      const nv = LEI_NIVEL[norm(c[1])]; cab.length = nv + 1; cab[nv] = leiLimpar(l, pdf);
      cabAberto = nv; ultimoCab = l; pular = false; continue; }
    const a = l.match(LEI_INICIO);
    if(a){
      fecharArt(); pular = false; cabAberto = -1;
      const k = prefixo + leiNum(a[1]) + (a[2] ? '-'+a[2] : '');
      const num = a[1] + (leiNum(a[1]) < 10 ? 'º' : '') + (a[2] ? '-'+a[2] : '');
      art = {k, rot: (prefixo ? 'ADCT, art. ' : 'Art. ') + num, h: hAtual(), d: []};
      if(rubrica){ art.tit = rubrica; rubrica = ''; }
      const resto = l.slice(a[0].length);
      if(resto){ disp = {r:'caput', t:resto}; art.d.push(disp); }
      else if(linhas[i+1] && !LEI_INICIO.test(linhas[i+1]) && !LEI_DISP.some(([re]) => re.test(linhas[i+1])) && linhas[i+1].length < 90 && !/[.;:]$/.test(linhas[i+1])){ art.tit = leiLimpar(linhas[++i], pdf); }
      continue;
    }
    if(pular) continue;
    if(!art && l.length < 110 && cabAberto < 0 && /^[A-ZÀ-Ú]/.test(l) && !/[.;:,]$/.test(l) && LEI_INICIO.test(linhas[i+1] || '')){ rubrica = leiLimpar(l, pdf); continue; }
    if(!art){ if(cabAberto >= 0 && l.length < 140 && !/[;:]$/.test(l)){ cab[cabAberto] = cab[cabAberto].replace(/\s*[-–—]\s*$/,'') + ' – ' + leiLimpar(l, pdf); cabAberto = -1; } continue; }
    let achou = null;
    for(const [re, rot] of LEI_DISP){ const m = l.match(re); if(m){ achou = {r: rot(m), t: l.slice(m[0].length)}; break; } }
    if(achou && !(pdf && disp && /^\d{1,2}\.$/.test(achou.r) && !/[.;:]$/.test(disp.t))){ fecharDisp(); disp = achou; art.d.push(disp); continue; }
    // rubrica (nome do crime, título do artigo) entre dispositivos: vira título do próximo artigo
    const prox = linhas[i+1] || '';
    if(l.length < 110 && /^[A-ZÀ-Ú]/.test(l) && !/[.;:,]$/.test(l) && (!disp || /[.;:]["”]?$/.test(leiLimpar(disp.t, pdf))) && (LEI_INICIO.test(prox) || LEI_DISP.some(([re]) => re.test(prox)))){
      if(LEI_INICIO.test(prox)) rubrica = leiLimpar(l, pdf); continue; }
    // continuação do dispositivo anterior (texto quebrado em linhas no PDF, ou parágrafo sem rótulo)
    if(disp){ disp.t += (/-$/.test(disp.t) && pdf ? '' : ' ') + l; }
    else { disp = {r:'caput', t:l}; art.d.push(disp); }
  }
  fecharArt();
  return {arts};
}
// texto normalizado do catálogo: uma linha por dispositivo, cabeçalhos com "#"
function leiParaTexto(lei, meta){
  const out = []; let h = null;
  if(meta) out.push(`@lei: ${meta.id} | ${meta.nome} | ${meta.sigla}`, ...(meta.fonte ? ['@fonte: '+meta.fonte] : []), ...(meta.atualizado ? ['@atualizado: '+meta.atualizado] : []));
  lei.arts.forEach(a => {
    if(a.h !== h){ h = a.h; out.push('# ' + (h || '')); }
    const ini = a.d[0] && a.d[0].r === 'caput';
    out.push(a.rot + (a.tit ? ' {' + a.tit + '}' : '') + (ini ? ' ' + a.d[0].t : ''));
    a.d.forEach((x, i) => { if(i === 0 && ini) return;
      out.push((x.r === 'Pena' ? 'Pena -' : /^[IVXLC]+$/.test(x.r) ? x.r + ' -' : x.r) + ' ' + x.t); });
  });
  return out.join('\n');
}
// lê o texto normalizado do catálogo (rápido, sem heurísticas)
function leiDoCatalogo(txt){
  const meta = {}, arts = []; let h = '', art = null;
  txt.split('\n').forEach(l => {
    if(!l) return;
    if(l[0] === '@'){ const m = l.match(/^@(\w+):\s*(.*)$/); if(m){ if(m[1] === 'lei'){ const [id, nome, sigla] = m[2].split('|').map(s => s.trim()); Object.assign(meta, {id, nome, sigla}); } else meta[m[1]] = m[2]; } return; }
    if(l[0] === '#'){ h = l.slice(1).trim(); return; }
    const a = l.match(/^((?:ADCT, art\.|Art\.) (\d[\d.]*)º?(?:-([A-Z]{1,3}))?)(?: \{([^}]*)\})? ?(.*)$/);
    if(a){ const k = (a[1].startsWith('ADCT') ? 'ADCT ' : '') + leiNum(a[2]) + (a[3] ? '-'+a[3] : '');
      art = {k, rot: a[1], h, d: []}; if(a[4]) art.tit = a[4]; arts.push(art); if(a[5]) art.d.push({r:'caput', t:a[5]}); return; }
    if(!art) return;
    let m;
    if((m = l.match(/^(§ [^ ]+|Parágrafo único|[a-z]\)|\d{1,2}[.)]) (.*)$/))) art.d.push({r:m[1], t:m[2]});
    else if((m = l.match(/^([IVXLC]+) - (.*)$/))) art.d.push({r:m[1], t:m[2]});
    else if((m = l.match(/^Pena - (.*)$/))) art.d.push({r:'Pena', t:m[1]});
    else if(art.d.length) art.d[art.d.length-1].t += ' ' + l;
  });
  return {meta, arts};
}

/* ============ Lei seca: questões de certo ou errado ============

    for(; i < lista.length-1; i++){ r -= lista[i].w; if(r <= 0) break; } out.push(lista.splice(i,1)[0]); } };

    <div class="inl"><input type="file" accept="application/pdf,.pdf" onchange="lsPdf(this)" style="width:auto;flex:1;min-width:220px"></div>
    <details style="margin-top:10px"><summary class="mut" style="cursor:pointer">Ou cole o texto da lei</summary>
      <textarea id="lstxt" placeholder="Cole aqui o texto (do site oficial, por exemplo), com os artigos" style="margin-top:8px;min-height:120px"></textarea>
      <button class="g" style="margin-top:6px" onclick="lsTextoLei(document.getElementById('lstxt').value,false,'')">Ler o texto</button></details>`;
  if(p && p.msg) h += `<div class="alert ${/^Lendo/.test(p.msg)?'info':''}" style="margin-top:10px">${esc(p.msg)}</div>`;
  if(p && p.lei){ const a = p.lei.arts;
    h += `<div class="caixa" style="margin-top:12px"><b>Encontrei ${a.length} artigos</b> (${esc(a[0].rot)} a ${esc(a[a.length-1].rot)}) e ${a.reduce((s,x)=>s+x.d.length,0)} dispositivos.
      <div class="mut" style="margin:6px 0">${esc(a[0].rot)} ${esc(curto((a[0].d[0]||{t:''}).t, 160))}</div>
      <div class="row"><div><label>Nome da lei</label><input id="lsp_nome" value="${esc(p.nome)}"></div><div><label>Sigla curta</label><input id="lsp_sigla" value="${esc(p.sigla)}"></div><div><label>Número</label><input id="lsp_num" value="${esc(p.numero)}" placeholder="ex.: 10.261"></div>
        <div><label>Matéria do edital</label><select id="lsp_mat"><option value="">Nenhuma (só lei avulsa)</option>${S.materias.map(m => `<option value="${m.id}" ${m.id===p.materiaId?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></div></div>
      <p class="mut" style="margin:8px 0 0">Se o edital citar esta lei pelo número (ex.: “Lei ${esc(p.numero||'nº 0.000')}, arts. 1º a 20”), as questões focam nesses artigos. Sem citação, vale a lei inteira.</p>
      <div class="inl"><button class="b" onclick="lsSalvarPdf()">Salvar lei</button><button class="g" onclick="LS.pdf=null;render()">Cancelar</button></div></div>`; }
  const prop = S.leisProprias || [];
  if(prop.length) h += `<h3>Leis que você enviou</h3>${prop.map(x => `<div class="item"><div style="min-width:0"><b>${esc(x.sigla)}</b> <span class="mut">· ${esc(curto(x.nome, 80))} · ${x.arts||'?'} artigos${x.materiaId && mat(x.materiaId) ? ' · ' + esc(mat(x.materiaId).nome) : ''}</span></div><button class="x" title="Excluir" onclick="lsExcluirLei('${x.id}')">✕</button></div>`).join('')}`;
  return h + `</div>`;
}
const lsAssinatura = () => S.materias.map(m => m.id + ':' + m.topicos.map(t => t.nome).join('/')).join('|') + '#' + (S.leisProprias||[]).map(p => p.id + p.materiaId).join() + '#' + (S.leiSeca.extras||[]).join();
function vLeiSeca(){
  if(LS.pronto && LS.sig !== lsAssinatura()) lsInvalidar();
  if(!LS.pronto){ lsPreparar();
    return `<div class="card"><h2>Lei seca</h2>${LS.erro ? `<div class="alert bad">${esc(LS.erro)}</div><button class="b" onclick="LS.erro='';lsPreparar(true);render()">Tentar de novo</button>` : '<div class="empty">Carregando as leis do seu edital…</div>'}</div>`; }
  const G = lsResumoGeral(), leis = [...new Set(LS.alvos.map(a => a.lei))];
  const pesoLei = id => LS.alvos.filter(a => a.lei === id).reduce((s,a) => s + a.peso, 0);
  leis.sort((a,b) => pesoLei(b) - pesoLei(a));
  let h = `<div class="hoje"><div class="hk">
    <div><span class="ic">⚖️</span><span><small>Leis no seu edital</small><b>${leis.length}</b><small>${LS.alvos.length} assuntos ligados a leis</small></span></div>
    <div><span class="ic">✅</span><span><small>Questões hoje</small><b>${G.hoje[0]}</b><small>${G.hoje[0] ? pct(G.hoje[1]/G.hoje[0]) + ' de acerto' : 'nenhuma ainda'}</small></span></div>
    <div><span class="ic">🎯</span><span><small>Acerto geral</small><b>${G.p == null ? '—' : pct(G.p)}</b><small>${G.q} questões no total</small></span></div>
    <div><span class="ic">🧠</span><span><small>Dispositivos dominados</small><b>${G.dom}</b><small>${G.dev} para revisar hoje</small></span></div></div>`;
  if(LS.erro) h += `<div class="alert bad">${esc(LS.erro)}</div>`;
  if(!leis.length) h += `<div class="alert info">Seu edital ainda não cita leis que eu reconheça. Adicione abaixo uma lei do catálogo ou envie o PDF da lei.</div>`;
  if(LS.sessao) h += LS.sessao.fim ? lsCardFim() : lsCardQuestao();
  else h += `<div class="card"><h2>Treinar</h2><p class="mut" style="margin-top:-4px">Afirmações de certo ou errado com o texto da lei. As erradas trocam um detalhe, como as bancas fazem: prazo, número, “poderá/deverá”, competência, pena… Os dispositivos que você erra voltam até você acertar; os que acerta voltam em intervalos cada vez maiores.</p>
    <div class="row"><div><label>Lei</label><select onchange="LS.filtro=this.value;LS.artsTxt='';if(!this.value&&LS.modo==='inteira')LS.modo='edital';render()"><option value="">Todas as leis do edital (pela incidência)</option>${leis.map(id => `<option value="${id}" ${LS.filtro===id?'selected':''}>${esc(LS.leis[id].sigla)} · ${esc(curto(LS.leis[id].nome, 60))}</option>`).join('')}</select></div>
      <div><label>Modo</label><select onchange="LS.modo=this.value;render()"><option value="edital" ${LS.modo==='edital'?'selected':''}>Artigos do edital</option><option value="inteira" ${LS.modo==='inteira'?'selected':''} ${LS.filtro?'':'disabled'}>Lei inteira${LS.filtro?'':' (escolha uma lei)'}</option><option value="erros" ${LS.modo==='erros'?'selected':''}>Só os meus erros</option></select></div>
      <div><label>Artigos (opcional)</label><input id="lsarts" value="${esc(LS.artsTxt)}" placeholder="${LS.filtro ? 'ex.: 5, 37 a 41, 312-A' : 'escolha a lei primeiro'}" oninput="LS.artsTxt=this.value;const e=document.getElementById('lsartsinfo');if(e)e.innerHTML=lsArtsInfo()" onkeydown="if(event.key==='Enter')lsIniciar()"><div id="lsartsinfo" style="margin-top:6px">${lsArtsInfo()}</div></div>
      <div><label>Questões</label><select onchange="LS.qtd=+this.value"><option ${LS.qtd===10?'selected':''}>10</option><option ${LS.qtd===20?'selected':''}>20</option><option ${LS.qtd===30?'selected':''}>30</option><option ${LS.qtd===50?'selected':''}>50</option></select></div></div>
    <div class="inl"><button class="b" onclick="lsIniciar()" ${leis.length?'':'disabled'}>▶ Começar</button><button class="g" onclick="lsIrPdf()">📄 Adicionar lei em PDF</button>${LS.artsTxt.trim()?`<button class="g" onclick="LS.artsTxt='';render()">Limpar artigos</button>`:''}${G.dev ? `<span class="mut">${G.dev} dispositivo(s) para revisar hoje entram primeiro.</span>` : ''}</div></div>`;
  if(LS.ver) h += lsCardLer();
  const foco = lsFoco();
  h += `<div class="card" style="margin-top:18px"><h2>Suas leis <span class="mut">da mais cobrada para a menos cobrada no seu edital</span></h2><div class="lsleis">
    ${leis.length ? leis.map(id => { const L = LS.leis[id], pr = lsProgresso(id);
      return `<div class="lslei"><div class="lslei-cab"><div style="min-width:0"><b>${esc(L.sigla)}</b> <span class="mut">· ${esc(curto(L.nome, 70))}</span><div class="mut" style="font-size:13px">${lsFaixasTxt(id)} · ${pr.tot} dispositivos</div></div>
        <span class="lslei-p ${pr.p==null?'':pr.p>=.8?'ok':pr.p>=.6?'warn':'bad'}">${pr.p==null?'—':pct(pr.p)}</span></div>
        <div class="brow" style="grid-template-columns:110px 1fr 70px"><span class="mut">Treinados</span><div class="bar"><i style="width:${pr.tot?pr.vistos/pr.tot*100:0}%"></i></div><span>${pr.vistos}/${pr.tot}</span></div>
        <div class="brow" style="grid-template-columns:110px 1fr 70px"><span class="mut">Dominados</span><div class="bar"><i class="ok" style="width:${pr.tot?pr.dom/pr.tot*100:0}%"></i></div><span>${pr.dom}</span></div>
        <div class="inl" style="margin-top:6px"><button class="g" onclick="LS.filtro='${id}';LS.modo='edital';lsIniciar({lei:'${id}'})">▶ Treinar</button><button class="g" onclick="LS.sel=LS.ver==='${id}'?LS.sel:[];LS.ver='${id}';LS.verTodos=false;LS.verMais=60;LS.busca='';LS.verArt='';render();setTimeout(()=>{const e=document.getElementById('lsler');if(e&&e.scrollIntoView)e.scrollIntoView({block:'start'})},30)">Ler os artigos</button></div></div>`; }).join('') : '<div class="empty">Nenhuma lei ainda.</div>'}</div></div>
    <div class="g3" style="margin-top:18px"><div class="card"><h2>Onde focar</h2>${foco.length ? foco.map(x => { const L = LS.leis[x.lei], a = L.porK[x.k], p = x.a/(x.a+x.e);
        return `<div class="item"><div style="min-width:0"><b>${esc(L.sigla)}, ${esc(a ? a.rot : x.k)}</b>${a&&a.tit?` <span class="mut">· ${esc(curto(a.tit,40))}</span>`:''}<div class="mut">${x.a} certas · ${x.e} erradas</div></div>
          <span class="tag ${p<.5?'bad':'warn'}">${pct(p)}</span><button class="g" onclick="lsIniciar({lei:'${x.lei}',art:'${x.k}',inteira:true,titulo:'${esc(L.sigla)}, ${esc(a?a.rot:x.k)}'})">Treinar</button></div>`; }).join('')
      : '<div class="empty">Treine algumas rodadas: aqui aparecem os artigos em que você mais erra.</div>'}</div>
    ${lsCardPdf()}
    <div class="card"><h2>Outras leis do catálogo <button class="g" onclick="LS.outras=!LS.outras;render()">${LS.outras?'Ocultar':'Mostrar'}</button></h2>
      ${LS.outras ? (LS.indice||[]).map(l => { const noEd = LS.alvos.some(a => a.lei === l.id && a.topicoId), ex = (S.leiSeca.extras||[]).includes(l.id);
        return `<div class="item"><div style="min-width:0"><b>${esc(l.sigla)}</b> <span class="mut">· ${esc(curto(l.nome, 70))} · ${l.arts} artigos</span></div>${noEd ? '<span class="tag ok">no edital</span>' : `<button class="g" onclick="lsAlternarExtra('${l.id}')">${ex ? 'Tirar do treino' : '+ Treinar'}</button>`}</div>`; }).join('')
        : '<p class="mut" style="margin:0">Leis prontas no tutor (texto oficial atualizado). As do seu edital entram sozinhas; as outras você pode adicionar.</p>'}</div></div>`;
  return h + `</div>`;
}

/* ============ Site com login (Firebase) ============
   Cada pessoa entra com a conta Google; os dados ficam em usuarios/<id da pessoa>,
   e as regras do banco só deixam cada um ler e gravar a própria pasta. */
let FB = null;
function adaptadorFirebase(fs, uid){
  const mapa = p => p.replace(/^tutor\/estado/, 'usuarios/'+uid);
  return { doc: p => fs.doc(mapa(p)) };
}
function telaLogin(msg){
  document.getElementById('menu').innerHTML = `<div class="logo"><i>✓</i>Estudo Guiado</div>`;
  document.getElementById('titulo').textContent = 'Entrar';
  ['cron','contagem','sync'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = ''; });
  document.getElementById('app').innerHTML = `<div class="card" style="max-width:560px">
    <h2>Estudo Guiado: seu tutor para concursos</h2>
    <p>Edital verticalizado, metas do dia com pomodoro, cronograma da semana, revisões espaçadas e análise de desempenho por assunto.</p>
    <p class="mut">Entre com sua conta Google. Cada pessoa tem o próprio espaço: ninguém vê os seus dados, e você acessa o mesmo progresso no celular, no tablet e no computador.</p>
    ${msg?`<div class="alert bad">${esc(msg)}</div>`:''}
    <button class="b" id="btnEntrar" onclick="entrarGoogle()" style="margin-top:6px">Entrar com Google</button></div>`;
}
async function entrarGoogle(){
  const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
  const b = document.getElementById('btnEntrar'); if(b){ b.disabled = true; b.textContent = 'Abrindo o login…'; }
  try{ await FB.auth.signInWithPopup(prov); }
  catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)){ try{ await FB.auth.signInWithRedirect(prov); return; }catch(e2){ e = e2; } }
    if(e.code==='auth/popup-closed-by-user'){ telaLogin(); return; }
    telaLogin(e.code==='auth/unauthorized-domain' ? 'Este endereço ainda não foi autorizado no Firebase (Authentication → Configurações → Domínios autorizados).' : 'Não foi possível entrar: '+(e.message||e.code));
  }
}
async function sairConta(){
  if(!(await confirmar('Sair da sua conta neste aparelho? Seus dados continuam salvos e aparecem quando você entrar de novo.'))) return;
  clearTimeout(filaSalvar); try{ await gravarOnline(); }catch(e){}
  await FB.auth.signOut();
}
async function iniciarFirebase(){
  document.getElementById('app').innerHTML = '<div class="card"><h2>Carregando…</h2></div>';
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    FB = {auth: firebase.auth(), fs: firebase.firestore()};
    try{ await FB.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  }catch(e){ document.getElementById('app').innerHTML = '<div class="card"><h2>Não foi possível iniciar</h2><p class="mut">'+esc(e.message)+'</p></div>'; return; }
  FB.auth.onAuthStateChanged(async u => {
    clearTimeout(filaSalvar); ultimoSalvo = {}; sujo = false; pendente = false;
    if(!u){ ONLINE = null; S = padrao(); telaLogin(); return; }
    ONLINE = {tipo:'firebase', db: adaptadorFirebase(FB.fs, u.uid), usuario:{nome:u.displayName||'', email:u.email||''}};
    document.getElementById('app').innerHTML = '<div class="card"><h2>Carregando seus dados…</h2></div>';
    try{ const d = await carregarOnline(); S = d || padrao(); ultimaLeitura = Date.now(); }
    catch(e){ S = padrao(); ONLINE.somenteLeitura = true; avisar('Não consegui ler seus dados agora ('+(e.code||e.message)+'). Nada será salvo até recarregar a página.'); }
    migrar(); aba = 'painel'; render(); statusSync(ONLINE.somenteLeitura ? 'Sem conexão com seus dados' : 'Salvo na sua conta ✓');
  });
  // aviso de versão nova do site
  const checar = async () => { try{ const r = await fetch('versao.json?t='+Date.now()); if(!r.ok) return; const v = await r.json();
    if(v.versao > VERSAO) window.__atualizacao(v.versao, v.notas, ''); }catch(e){} };
  setInterval(checar, 30*60000); document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') checar(); });
}

async function iniciar(){
  if(window.FIREBASE_CONFIG){
    try{ await window.SDK_PRONTO; }catch(e){ document.getElementById('app').innerHTML = '<div class="card"><h2>Não foi possível carregar o login</h2><p class="mut">Confira a internet e recarregue a página.</p></div>'; return; }
    return iniciarFirebase();
  }
  const noClaude = !DESK && window.claude && typeof window.claude.use === 'function';
  if(noClaude){
    document.getElementById('app').innerHTML = '<div class="card"><h2>Carregando seus dados…</h2><p class="mut">Buscando seu progresso salvo na sua conta.</p></div>';
    let db = null; try{ db = await window.claude.use('db'); }catch(e){}
    if(db){
      ONLINE = {tipo:'claude', db};
      try{ const d = await carregarOnline(); S = d || padrao(); }
      catch(e){ S = padrao(); ONLINE.somenteLeitura = true; avisar('Não consegui ler seus dados online agora ('+(e.code||e.message)+'). Nada será salvo até recarregar a página.'); }
      migrar(); render(); statusSync(ONLINE.somenteLeitura ? 'Sem conexão com seus dados' : 'Salvo na sua conta ✓');
      return;
    }
  }
  load(); render();
  if(DESK && DESK.ok) DESK.ok(VERSAO);
}
iniciar();
</script>

  try{
    if(tipo==='texto'){
      const txt = document.getElementById('tecTxt').value;
      if(!txt.trim()){
        if(!link) return avisar('Cole o índice do caderno (ou o link e o índice) antes de cruzar com o edital.');
        if(mid) mat(mid).tecLink = link; else S.config.tecLinkGeral = link;
        save(); render();
        return avisar('Link salvo. O TEC só mostra o caderno para quem está logado, então o site não consegue abrir o link sozinho. Falta colar o índice: no caderno, aba Índice → Expandir → Ctrl+A → Ctrl+C, e cole no quadro.');

    if(tipo==='texto' && itens.every(x => tecMateriaPorNome(x.nome) || TEC_TOPO.test(norm(x.nome))))
      return avisar('Só vieram os nomes das matérias. No índice do caderno, clique em "Expandir" para abrir todos os assuntos e copie de novo.');
    tecCruzar(mid, itens, tipo);
    if(!tecEstado.itens.some(x=>x.alvo)){ tecEstado = null; render(); return avisar('Nenhum assunto do caderno bateu com o edital. Escolha a matéria e tente de novo.'); }
    if(link){ if(tecEstado.materiaId === '*') S.config.tecLinkGeral = link; else mat(tecEstado.materiaId).tecLink = link; }
    save(); render();

}

function tecTotais(){      // {topicoId: questões}

function tecMateriasDoResultado(){

// Link direto na área do aluno do Estratégia: a aula do assunto, o curso da matéria ou, sem curso definido, "Minhas Matrículas"
const EST_BASE = 'https://www.estrategiaconcursos.com.br/app/dashboard/cursos';
function linkEstrategia(m, t){
  if(!m || !m.estCurso) return EST_BASE;
  const n = t && (String(t.aula||'').match(/\d+/) || [])[0], aula = n != null && m.estAulas ? m.estAulas[String(+n).padStart(2,'0')] : null;
  return `${EST_BASE}/${m.estCurso}/aulas` + (aula ? '/' + aula : '');
}
function setMatEstLink(id, v){
  const m = mat(id); v = v.trim();
  if(!v){ delete m.estCurso; delete m.estAulas; save(); render(); return; }
  const e = parseEstrategia(v);
  if(!/estrategiaconcursos\.com\.br/i.test(v) || !e.id){ avisar('Cole o link do curso na área do aluno do Estratégia (ex.: https://www.estrategiaconcursos.com.br/app/dashboard/cursos/370448/aulas).'); render(); return; }
  if(m.estCurso !== e.id){ m.estCurso = e.id; m.estAulas = {}; }
  save(); render();
}
function setMatCurso(id,v){ mat(id).curso = v.trim(); save(); render(); }
function setMatLink(id,v){ v = v.trim(); if(v && !/^https:\/\/(www\.)?tecconcursos\.com\.br\//i.test(v)){ avisar('Use um link do TEC Concursos (https://www.tecconcursos.com.br/...).'); render(); return; } mat(id).tecLink = v; save(); render(); }
function setMat(id,k,v){const m=mat(id); if(k!=='nome') v=Math.min(5,Math.max(1,v||1)); m[k]=v; save(); render();}
function setTop(mid,tid,k,v){const t=topico(mat(mid),tid); t[k]=v; if(k==='status'&&v==='nao') t.feitos=0; save(); render();}
function addMat(){const n=nm.value.trim(); if(!n) return; const m={id:uid(),nome:n,peso:3,nivel:3,curso:'',topicos:[]}; S.materias.push(m); abertas.add(m.id); save(); render();}
function addTop(mid){const i=document.getElementById('nt_'+mid), n=i.value.trim(); if(!n) return; mat(mid).topicos.push({id:uid(),nome:n,status:'nao',incid:2,paginas:0,feitos:0,aula:''}); abertas.add(mid); save(); render(); document.getElementById('nt_'+mid).focus();}
async function delTop(mid,tid){if(!(await confirmar('Excluir assunto e seu histórico?')))return; const m=mat(mid); m.topicos=m.topicos.filter(t=>t.id!==tid); S.revisoes=S.revisoes.filter(r=>r.topicoId!==tid); S.sessoes=S.sessoes.filter(s=>s.topicoId!==tid); save(); render();}
async function delMat(id){if(!(await confirmar('Excluir a matéria e todo o seu histórico?')))return; S.materias=S.materias.filter(m=>m.id!==id); S.sessoes=S.sessoes.filter(s=>s.materiaId!==id); S.revisoes=S.revisoes.filter(r=>r.materiaId!==id); save(); render();}
function importar(texto, silencioso){
  let atual=null, nM=0, nT=0, nU=0;
  (texto ?? imp.value).split('\n').forEach(l => {
    l = l.trim(); if(!l || l.startsWith('//')) return;
    if(l.startsWith('@')){ const [k,...v] = l.slice(1).split(':'); const val = v.join(':').trim();
      if(k.trim()==='concurso') S.config.concurso = val; if(k.trim()==='banca') S.config.banca = val;
      if(k.trim()==='estrategia' && atual){ const e = parseEstrategia(val); if(e.id){ atual.estCurso = e.id; atual.estAulas = e.aulas; } }
      return; }
    if(/^[-•*]/.test(l)){
      if(!atual) return;
      let nome = l.replace(/^[-•*]\s*/,''), incid = null, pag = null, aula = null, mm;
      if((mm = nome.match(/\[([^\]]*)\]/))){ aula = mm[1].trim(); nome = nome.replace(mm[0],''); }
      if((mm = nome.match(/#\s*(\d+)/))){ pag = +mm[1]; nome = nome.replace(mm[0],''); }
      if((mm = nome.match(/\*\s*([123])(?!\d)/))){ incid = +mm[1]; nome = nome.replace(mm[0],''); }
      nome = nome.replace(/\s+/g,' ').trim(); if(!nome) return;
      const ex = atual.topicos.find(t=>t.nome.toLowerCase()===nome.toLowerCase());
      if(ex){ if(incid) ex.incid=incid; if(pag!=null) ex.paginas=pag; if(aula!=null) ex.aula=aula; nU++; }
      else { atual.topicos.push({id:uid(),nome,status:'nao',incid:incid||2,paginas:pag||0,feitos:0,aula:aula||''}); nT++; }
    } else {
      const [nome,peso,nivel,curso] = l.replace(/^#+\s*/,'').split('|').map(x=>x.trim());
      if(!nome) return;
      atual = S.materias.find(m=>m.nome.toLowerCase()===nome.toLowerCase());
      const c = v => Math.min(5,Math.max(1,+v||3));
      if(!atual){ atual={id:uid(),nome,peso:c(peso),nivel:c(nivel),curso:curso||'',topicos:[]}; S.materias.push(atual); nM++; }
      else { if(peso) atual.peso=c(peso); if(nivel) atual.nivel=c(nivel); if(curso) atual.curso=curso; }
    }
  });
  save(); const msg = `${nM} matérias novas, ${nT} assuntos novos, ${nU} assuntos atualizados.`; if(!silencioso) avisar('Importado: '+msg); render(); return msg;
}

/* ---------- Desempenho ---------- */
function vDesempenho(){
  if(!S.sessoes.length) return `<div class="card"><h2>Desempenho</h2><div class="empty">Conclua metas registrando questões e acertos para ver sua evolução.</div></div>`;
  const g = stats(()=>true);
  const semanas = []; for(let i=7;i>=0;i--){const ini=addDias(segunda(hoje()),-7*i), fim=addDias(ini,7); semanas.push({ini, ...stats(s=>s.data>=ini&&s.data<fim)});}
  const maxS = Math.max(...semanas.map(s=>s.min), 1);
  const porMat = S.materias.map(m=>({m,...stats(s=>s.materiaId===m.id)})).filter(x=>x.min||x.q);
  const rec = stats(s=>s.data>=addDias(hoje(),-14)), ant = stats(s=>s.data>=addDias(hoje(),-28)&&s.data<addDias(hoje(),-14));
  const tend = rec.p!=null&&ant.p!=null ? Math.round((rec.p-ant.p)*100) : null;
  const banco = []; S.materias.forEach(m=>m.topicos.forEach(t=>{const ix=indice(t.id); if(ix.q) banco.push({m,t,...ix, prox:(S.revisoes.filter(r=>r.topicoId===t.id&&!r.feita).map(r=>r.due).sort()[0])});}));
  banco.sort((a,b)=>a.p-b.p);
  const tp = tempoPorTipo('0000-00-00'), tpt = tp.conteudo+tp.questoes+tp.revisao;
  return `<div class="kpis">
    <div class="kpi"><div><div class="mut">Horas totais</div><div class="big">${hm(g.min)}</div></div></div>
    <div class="kpi"><div><div class="mut">Questões</div><div class="big">${g.q}</div></div></div>
    <div class="kpi"><div><div class="mut">Acerto geral</div><div class="big">${pct(g.p)}</div></div></div>
    <div class="kpi"><div><div class="mut">Tendência (14 dias)</div><div class="big">${tend==null?'—':(tend>0?'+':'')+tend+' pp'}</div></div></div></div>
    <div class="card"><h2>Banco de assuntos <span class="mut">do mais fraco ao mais forte · limiar ${S.config.limiar}%</span></h2>
    ${banco.length?`<table><tr><th>Assunto</th><th class="n">Questões</th><th class="n">Índice</th><th>Situação</th><th class="n">Próx. revisão</th></tr>${banco.map(x=>{const [cl,cc]=classe(x.p);return `<tr><td>${esc(x.t.nome)}<div class="mut">${esc(x.m.nome)}</div></td><td class="n">${x.q}</td><td class="n">${pct(x.p)}</td><td><span class="tag ${cc}">${cl}</span></td><td class="n">${x.prox?br(x.prox).slice(0,5):'—'}</td></tr>`}).join('')}</table>`:'<div class="empty">Registre questões por assunto para montar o banco.</div>'}
    <p class="mut">Índice = acerto ponderado pela recência (as sessões mais novas pesam mais).</p></div>
    <div class="grid" style="margin-top:16px"><div class="card"><h2>Acerto por matéria</h2>${porMat.sort((a,b)=>(a.p??2)-(b.p??2)).map(x=>`<div class="brow"><span>${esc(curto(x.m.nome,24))}<div class="mut">${x.q}q · ${hm(x.min)}</div></span>
      <div class="bar"><i class="${corP(x.p)}" style="width:${(x.p||0)*100}%"></i></div><span>${pct(x.p)}</span></div>`).join('')}</div>
    <div class="card"><h2>Horas por semana</h2><div class="weeks">${semanas.map(s=>`<div><span>${s.min?hm(s.min):''}</span><b style="height:${s.min/maxS*100}%"></b>${br(s.ini).slice(0,5)}</div>`).join('')}</div>
      <h3>Acerto por semana</h3><div class="weeks" style="height:90px">${semanas.map(s=>`<div><span>${s.q?pct(s.p):''}</span><b style="height:${(s.p||0)*100}%;background:var(--${corP(s.p)||'line'})"></b>${br(s.ini).slice(0,5)}</div>`).join('')}</div>
      <h3>Tempo por atividade (total)</h3>${tpt?`<div class="stack"><i style="width:${tp.conteudo/tpt*100}%;background:var(--acc)"></i><i style="width:${tp.questoes/tpt*100}%;background:var(--ok)"></i><i style="width:${tp.revisao/tpt*100}%;background:var(--rev)"></i></div>
      <div class="leg"><span style="--c:var(--acc)">Teoria + questões ${hm(tp.conteudo)}</span><span style="--c:var(--ok)">Questões ${hm(tp.questoes)}</span><span style="--c:var(--rev)">Revisão ${hm(tp.revisao)}</span></div>`:''}</div></div>`;
}

function atualizaTopicos(){

    <p class="mut">Mudanças aqui valem para as próximas metas. Use “Refazer pendentes” em Metas de hoje para aplicar já.</p></div>
    <div class="card"><h2>Como o tutor funciona</h2><ul class="pl" style="padding-left:18px;margin:0">
      <li><b>Repetição espaçada</b> (curva do esquecimento de Ebbinghaus): revisões em intervalos crescentes, que encurtam quando o acerto cai.</li>
      <li><b>Prática de recuperação</b> (Roediger e Karpicke; <i>Make It Stick</i>): toda meta termina em questões, e as revisões começam por questões, não por releitura.</li>
      <li><b>Intercalação e dificuldades desejáveis</b> (Robert e Elizabeth Bjork): as metas alternam matérias em vez de concentrar tudo numa só.</li>
      <li><b>Foco e pausas</b> (Barbara Oakley, <i>Aprendendo a Aprender</i>): blocos divididos em focos de até ~50 min com pausas curtas.</li>
      <li><b>Os 4 pilares da aprendizagem</b> (Stanislas Dehaene): atenção, engajamento ativo, retorno sobre o erro e consolidação (1ª revisão no dia seguinte, depois do sono).</li>
      <li><b>Constância</b>: sequência de dias e XP tornam o progresso visível e ajudam a manter o hábito.</li></ul></div>
    <div class="card"><h2>Dados e backup</h2><p class="mut">${ONLINE && ONLINE.tipo==='firebase' ? 'Seus dados ficam salvos na sua conta (login Google) e aparecem em todos os aparelhos em que você entrar: computador, celular e tablet.' : ONLINE ? 'Seus dados ficam salvos na sua conta do Claude e aparecem em todos os aparelhos em que você abrir este link (computador, celular, tablet).' : DESK ? 'Seus dados são salvos automaticamente em <b>Documentos\\Tutor de Estudos\\dados.json</b> (com uma cópia da versão anterior).' : 'Os dados ficam salvos neste navegador. Faça backup regularmente.'}</p>
    <button class="b" onclick="exportar()">Baixar backup (.json)</button> ${DESK ? '<button class="g" onclick="DESK.abrirPasta()">Abrir pasta dos dados</button>' : ''}
    <label>${ONLINE ? 'Trazer dados de outra versão (arquivo de backup .json do programa ou do link do Claude)' : 'Restaurar backup'}</label><input type="file" accept=".json" onchange="restaurar(this.files[0])">
    ${ONLINE && ONLINE.tipo==='firebase' ? `<h3>Conta</h3><p class="mut">Conectada como <b>${esc(ONLINE.usuario.nome)}</b> (${esc(ONLINE.usuario.email)}).</p><button class="g" onclick="sairConta()">Sair da conta</button>` : ''}
    <h3>Versão do programa</h3><p class="mut" id="infoVersao">Versão ${VERSAO}.${DESK ? ' As atualizações chegam automaticamente quando você abre o programa.' : ''}</p>
    ${DESK ? '<button class="g" onclick="verificarAtualizacao()">Verificar atualizações agora</button>' : ''}
    <h3>Zona de perigo</h3><button class="g" style="color:var(--bad)" onclick="confirmar('Apagar TODOS os dados?').then(ok=>{if(ok){S=padrao();save();render();}})">Apagar todos os dados</button></div></div>`;
}
const REPLANEJA = ['horasUtil','horasFds','blocoMin','blocoMax','ritmoPag','limiar','ordemEstudo'];
let avisoCfg = '';
function setCfg(k,v){
  S.config[k]=v;
  if(REPLANEJA.includes(k) && S.materias.length){ gerarMetas(true); avisoCfg = 'Cronograma e metas pendentes de hoje recalculados com '+hm(minSemana())+' líquidas por semana.'; }
  save(); render();
}
function setPomo(k,v){ S.config.pomodoro = Object.assign({}, cfgPomo(), {[k]:v}); save(); render(); }
function setInt(v){const a=v.split(/[,; ]+/).map(Number).filter(n=>n>0); if(a.length){S.config.intervalos=a; save();} render();}
async function exportar(){
  const nome = 'tutor-estudos-backup-'+hoje()+'.json', json = JSON.stringify(S,null,1);
  if(ONLINE){ let dl = null; try{ dl = await window.claude.use('downloads'); }catch(e){}
    if(dl){ try{ await dl.save({filename:nome, data:json}); avisar('Backup salvo.'); }catch(e){ if(e.code!=='declined') avisar('Não foi possível salvar o backup ('+(e.code||e.message)+').'); } return; } }
  exportarArquivo();
}
function exportarArquivo(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='tutor-estudos-backup-'+hoje()+'.json'; a.click();}
function restaurar(f){if(!f)return; const r=new FileReader(); r.onload=async ()=>{try{const d=JSON.parse(r.result); if(!d.materias) throw 0; confirmar('Substituir os dados atuais pelo backup?').then(ok=>{if(ok){S=d; migrar(); save(); render();}})}catch(e){avisar('Arquivo de backup inválido.');}}; r.readAsText(f);}

/* ============ Atualizações ============ */
function verificarAtualizacao(){ const i=document.getElementById('infoVersao'); if(i) i.textContent='Procurando atualizações...'; DESK.verificar(); }
window.__atualizacao = function(v, notas, erro){
  const i = document.getElementById('infoVersao');
  if(erro){ if(i) i.textContent = 'Versão '+VERSAO+'. Não foi possível verificar agora ('+erro+'). Tente mais tarde.'; return; }
  if(!v){ if(i) i.textContent = 'Versão '+VERSAO+'. Você já está na versão mais recente.'; return; }
  const f = document.getElementById('faixa');
  f.innerHTML = '<span>Nova versão '+v+' pronta'+(notas?': '+esc(notas):'')+'</span><button onclick="location.reload()">Atualizar agora</button>';
  f.style.display = 'flex';
};

/* ============ Site com login (Firebase) ============
   Cada pessoa entra com a conta Google; os dados ficam em usuarios/<id da pessoa>,
   e as regras do banco só deixam cada um ler e gravar a própria pasta. */
let FB = null;
function adaptadorFirebase(fs, uid){
  const mapa = p => p.replace(/^tutor\/estado/, 'usuarios/'+uid);
  return { doc: p => fs.doc(mapa(p)) };
}
function telaLogin(msg){
  document.getElementById('menu').innerHTML = `<div class="logo"><i>✓</i>Estudo Guiado</div>`;
  document.getElementById('titulo').textContent = 'Entrar';
  ['cron','contagem','sync'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = ''; });
  document.getElementById('app').innerHTML = `<div class="card" style="max-width:560px">
    <h2>Estudo Guiado: seu tutor para concursos</h2>
    <p>Edital verticalizado, metas do dia com pomodoro, cronograma da semana, revisões espaçadas e análise de desempenho por assunto.</p>
    <p class="mut">Entre com sua conta Google. Cada pessoa tem o próprio espaço: ninguém vê os seus dados, e você acessa o mesmo progresso no celular, no tablet e no computador.</p>
    ${msg?`<div class="alert bad">${esc(msg)}</div>`:''}
    <button class="b" id="btnEntrar" onclick="entrarGoogle()" style="margin-top:6px">Entrar com Google</button></div>`;
}
async function entrarGoogle(){
  const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
  const b = document.getElementById('btnEntrar'); if(b){ b.disabled = true; b.textContent = 'Abrindo o login…'; }
  try{ await FB.auth.signInWithPopup(prov); }
  catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)){ try{ await FB.auth.signInWithRedirect(prov); return; }catch(e2){ e = e2; } }
    if(e.code==='auth/popup-closed-by-user'){ telaLogin(); return; }
    telaLogin(e.code==='auth/unauthorized-domain' ? 'Este endereço ainda não foi autorizado no Firebase (Authentication → Configurações → Domínios autorizados).' : 'Não foi possível entrar: '+(e.message||e.code));
  }
}
async function sairConta(){
  if(!(await confirmar('Sair da sua conta neste aparelho? Seus dados continuam salvos e aparecem quando você entrar de novo.'))) return;
  clearTimeout(filaSalvar); try{ await gravarOnline(); }catch(e){}
  await FB.auth.signOut();
}
async function iniciarFirebase(){
  document.getElementById('app').innerHTML = '<div class="card"><h2>Carregando…</h2></div>';
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    FB = {auth: firebase.auth(), fs: firebase.firestore()};
    try{ await FB.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  }catch(e){ document.getElementById('app').innerHTML = '<div class="card"><h2>Não foi possível iniciar</h2><p class="mut">'+esc(e.message)+'</p></div>'; return; }
  FB.auth.onAuthStateChanged(async u => {
    clearTimeout(filaSalvar); ultimoSalvo = {}; sujo = false; pendente = false;
    if(!u){ ONLINE = null; S = padrao(); telaLogin(); return; }
    ONLINE = {tipo:'firebase', db: adaptadorFirebase(FB.fs, u.uid), usuario:{nome:u.displayName||'', email:u.email||''}};
    document.getElementById('app').innerHTML = '<div class="card"><h2>Carregando seus dados…</h2></div>';
    try{ const d = await carregarOnline(); S = d || padrao(); ultimaLeitura = Date.now(); }
    catch(e){ S = padrao(); ONLINE.somenteLeitura = true; avisar('Não consegui ler seus dados agora ('+(e.code||e.message)+'). Nada será salvo até recarregar a página.'); }
    migrar(); aba = 'painel'; render(); statusSync(ONLINE.somenteLeitura ? 'Sem conexão com seus dados' : 'Salvo na sua conta ✓');
  });
  // aviso de versão nova do site
  const checar = async () => { try{ const r = await fetch('versao.json?t='+Date.now()); if(!r.ok) return; const v = await r.json();
    if(v.versao > VERSAO) window.__atualizacao(v.versao, v.notas, ''); }catch(e){} };
  setInterval(checar, 30*60000); document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') checar(); });
}

async function iniciar(){
  if(window.FIREBASE_CONFIG){
    try{ await window.SDK_PRONTO; }catch(e){ document.getElementById('app').innerHTML = '<div class="card"><h2>Não foi possível carregar o login</h2><p class="mut">Confira a internet e recarregue a página.</p></div>'; return; }
    return iniciarFirebase();
  }
  const noClaude = !DESK && window.claude && typeof window.claude.use === 'function';
  if(noClaude){
    document.getElementById('app').innerHTML = '<div class="card"><h2>Carregando seus dados…</h2><p class="mut">Buscando seu progresso salvo na sua conta.</p></div>';
    let db = null; try{ db = await window.claude.use('db'); }catch(e){}
    if(db){
      ONLINE = {tipo:'claude', db};
      try{ const d = await carregarOnline(); S = d || padrao(); }
      catch(e){ S = padrao(); ONLINE.somenteLeitura = true; avisar('Não consegui ler seus dados online agora ('+(e.code||e.message)+'). Nada será salvo até recarregar a página.'); }
      migrar(); render(); statusSync(ONLINE.somenteLeitura ? 'Sem conexão com seus dados' : 'Salvo na sua conta ✓');
      return;
    }
  }
  load(); render();
  if(DESK && DESK.ok) DESK.ok(VERSAO);
}
iniciar();
</script>

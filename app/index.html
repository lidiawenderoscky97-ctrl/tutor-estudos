<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="versao" content="18">
<!-- TUTOR-ESTUDOS-APP -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo Guiado</title>
<style>
:root{
  --bg:#f4f5fa;--card:#ffffff;--ink:#1b1d2a;--mut:#6c7085;--line:#e4e6ef;--soft:#f0f1f7;
  --acc:#4c4ad8;--acc2:#ecebfd;--accink:#ffffff;
  --ok:#128a4a;--okbg:#e3f5ea;--warn:#b25d06;--warnbg:#fdf0e1;--bad:#c02b2b;--badbg:#fdeaea;
  --rev:#7a3fc4;--revbg:#f2eafc;--ref:#b25d06;--refbg:#fdf0e1;--gold:#d49b12;
  --sb:#191a2e;--sbink:#b9bbd3;--sbon:#ffffff;--sbact:#2a2b47;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111219;--card:#1a1b26;--ink:#ecedf5;--mut:#9a9db3;--line:#2b2d3d;--soft:#222333;
  --acc:#8d8bff;--acc2:#27264a;--accink:#12121c;
  --ok:#4fd48a;--okbg:#16291f;--warn:#f2a54d;--warnbg:#2d2316;--bad:#f37575;--badbg:#301a1c;
  --rev:#c49bff;--revbg:#2a2140;--ref:#f2a54d;--refbg:#2d2316;--gold:#f2c14d;
  --sb:#0c0d14;--sbink:#9a9db3;--sbon:#ffffff;--sbact:#1f2033;
;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111219;--card:#1a1b26;--ink:#ecedf5;--mut:#9a9db3;--line:#2b2d3d;--soft:#222333;
  --acc:#8d8bff;--acc2:#27264a;--accink:#12121c;
  --ok:#4fd48a;--okbg:#16291f;--warn:#f2a54d;--warnbg:#2d2316;--bad:#f37575;--badbg:#301a1c;
  --rev:#c49bff;--revbg:#2a2140;--ref:#f2a54d;--refbg:#2d2316;--gold:#f2c14d;
  --sb:#0c0d14;--sbink:#9a9db3;--sbon:#ffffff;--sbact:#1f2033;
;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--sb);color:var(--sbink);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;color:var(--sbon);font-weight:700;font-size:17px;padding:4px 10px 16px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:15px}
aside button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--sbink);font:inherit;font-size:14px;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left}
aside button:hover{background:var(--sbact);color:var(--sbon)}
aside button.on{background:var(--sbact);color:var(--sbon);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
aside button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside .sep{flex:1}
aside .mini{font-size:12px;padding:8px 12px;color:var(--sbink)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 28px 0;max-width:1180px}
.top h1{font-size:22px;margin:0;letter-spacing:-.02em;flex:1;min-width:180px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--mut)}
.chip b{color:var(--ink)}
.chip.run{border-color:var(--acc);color:var(--acc)}
.chip.run b{color:var(--acc);font-variant-numeric:tabular-nums}
.chip button{background:none;border:0;color:inherit;cursor:pointer;font-size:13px;padding:0 2px;font-weight:600}
main{padding:18px 28px 60px;max-width:1180px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g2{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.col>.card+.card{margin-top:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:14px;margin:14px 0 6px}
.mut{color:var(--mut);font-size:13px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.kpi .big{font-size:22px;line-height:1.2}
.ring{flex:none}
.hero{background:var(--sb);color:#fff;border:0;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:inset 4px 0 0 var(--acc)}
.hero .mut{color:rgba(255,255,255,.8)}
.hero h2{color:#fff;font-size:20px;margin:0 0 4px}
.xp{flex:1;min-width:220px}
.xp .bar{background:rgba(255,255,255,.14)}
.xp .bar i{background:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;margin-right:6px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{font:inherit;font-size:14px;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:170px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
button.b{font:inherit;font-size:14px;padding:7px 14px;border-radius:9px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);cursor:pointer;font-weight:600}
button.g{font:inherit;font-size:13px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.g:hover{border-color:var(--acc);color:var(--acc)}
button.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;padding:2px 6px}
button.x:hover{color:var(--bad)}
button.lk{background:none;border:0;padding:0;color:var(--mut);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.item{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item:first-of-type{border-top:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.rev{background:var(--revbg);color:var(--rev)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.ok{background:var(--ok)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:8px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.brow{display:grid;grid-template-columns:minmax(110px,200px) 1fr 90px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.brow>span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.alert{padding:9px 12px;border-radius:9px;margin:6px 0;font-size:14px;background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}.alert.info{background:var(--acc2);color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mat{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.mat summary{padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none;flex-wrap:wrap}
.mat summary::-webkit-details-marker{display:none}
.mat .body{padding:4px 14px 12px;border-top:1px solid var(--line)}
.tp{display:grid;grid-template-columns:22px 1fr 70px 90px 64px 28px;gap:8px;align-items:center;padding:6px 0;font-size:14px;border-top:1px dashed var(--line)}
.tp.hd{border-top:0;color:var(--mut);font-size:12px}
.tp select,.tp input[type=number]{padding:3px 6px;font-size:13px}
.tp input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
.tp .nm small{display:block;color:var(--mut);font-size:12px}
.weeks{display:flex;gap:8px;align-items:flex-end;height:130px;padding-top:10px}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.weeks b{display:block;width:100%;max-width:38px;background:var(--acc);border-radius:5px 5px 0 0;min-height:2px}
.inl{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:8px}
.inl input{width:96px}
.meta{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0;background:var(--card);display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start}
.meta.feita{background:var(--soft)}
.meta .ck{width:26px;height:26px;border-radius:99px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--mut);margin-top:1px}
.meta.feita .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.meta.ativa{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.meta .tit{font-weight:600}
.meta .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.meta .caixa{grid-column:1/-1}
.tipo{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--acc2);color:var(--acc)}
.tipo.revisao{background:var(--revbg);color:var(--rev)}.tipo.reforco{background:var(--refbg);color:var(--ref)}
.tipo.extra{background:var(--soft);color:var(--ink)}
.tipo.questoes{background:var(--okbg);color:var(--ok)}
.aula{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);background:var(--soft);border-radius:7px;padding:3px 9px;margin-top:6px}
.caixa{margin-top:4px;padding:12px;border-radius:10px;background:var(--acc2)}
.pausa{text-align:center;color:var(--mut);font-size:12px;margin:-4px 0}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--line);display:inline-block}
.dots i.on{background:var(--acc)}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.semana{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.dia{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:160px}
.dia.hj{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.dia h4{margin:0 0 2px;font-size:13px;text-transform:capitalize}
.dia .mut{font-size:12px}
.bl{border-left:3px solid var(--acc);background:var(--soft);border-radius:6px;padding:6px 8px;margin-top:7px;font-size:12px;line-height:1.35}
.bl.revisao{border-color:var(--rev)}.bl.extra{border-color:var(--mut)}.bl.questoes{border-color:var(--ok)}.bl.reforco{border-color:var(--ref)}.bl.feita{opacity:.55;text-decoration:line-through}
.bl b{display:block;font-size:12px}
.pl{font-size:14px;line-height:1.6}
.pl li{margin:4px 0}
#faixa{background:var(--acc);color:#fff;padding:10px 16px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
#faixa button{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:0;background:#fff;color:var(--acc);font-weight:600;cursor:pointer}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
/* pomodoro */
.pomo{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pomo-anel{flex:none}
#modal{position:fixed;inset:0;background:rgba(10,10,24,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal .box{background:var(--card);color:var(--ink);border-radius:14px;padding:20px;max-width:460px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#modal p{white-space:pre-wrap;margin:0 0 16px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sb);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:4px}
@media (max-width:800px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;z-index:10}
  .logo,aside .sep,aside .mini{display:none}
  aside button{width:auto;white-space:nowrap;padding:8px 10px}
  aside button span{display:none}
  aside button.on span{display:inline}
  .top,main{padding-left:16px;padding-right:16px}
  .tp{grid-template-columns:22px 1fr 64px 28px}.tp .hide{display:none}
  .brow{grid-template-columns:100px 1fr 70px}
  .meta{grid-template-columns:28px 1fr}.meta .acts{grid-column:2;justify-content:flex-start}
}
</style>
</head>
<body>
<div id="faixa" style="display:none"></div>
<div class="app">
  <aside id="menu"></aside>
  <div>
    <div class="top"><h1 id="titulo"></h1><span id="cron"></span><span id="contagem"></span><span id="sync"></span></div>
    <main id="app"></main>
  </div>
</div>

<script>
/* =====================================================================
   Tutor de Estudos — interface (versão com painel, cronograma e cronômetro)
   ===================================================================== */
const VERSAO = +document.querySelector('meta[name=versao]').content;
const KEY = 'tutor-estudos-v1';
const DESK = window.desktop; // presente quando roda como programa do Windows

/* ============ Confirmação e aviso dentro da página ============ */
function confirmar(msg){
  return new Promise(res => {
    const m = document.createElement('div'); m.id = 'modal';
    m.innerHTML = '<div class="box" role="dialog" aria-modal="true"><p></p><div class="inl" style="justify-content:flex-end"><button class="g">Cancelar</button><button class="b">Confirmar</button></div></div>';
    m.querySelector('p').textContent = msg;
    const [c,o] = m.querySelectorAll('button'); const fim = v => { m.remove(); res(v); };
    c.onclick = () => fim(false); o.onclick = () => fim(true);
    m.addEventListener('keydown', e => { if(e.key==='Escape') fim(false); });
    document.body.appendChild(m); o.focus();
  });
}
let toastT;
function avisar(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 6000);
}

/* ============ Utilidades ============ */
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const hoje = () => iso(new Date());
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDias(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function br(s){if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}
function segunda(s){const d=parse(s);return addDias(s,-((d.getDay()+6)%7))}
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DIAS3 = ['dom','seg','ter','qua','qui','sex','sáb'];
const pct = p => p==null ? '—' : Math.round(p*100)+'%';
const hm = min => { min=Math.round(min||0); const h=Math.floor(min/60), m=min%60; return h ? h+'h'+(m?String(m).padStart(2,'0'):'') : m+'min'; };
const r5 = x => Math.round(x/5)*5;
const lim = () => (+S.config.limiar||75)/100;
const corP = p => p==null ? '' : p<.6 ? 'bad' : p<lim() ? 'warn' : 'ok';
const curto = (s,n) => (s=String(s||'')).length>n ? s.slice(0,n-1)+'…' : s;

const TIPOS = {extra:'Tempo extra', conteudo:'Conteúdo novo', teoria:'Teoria', questoes:'Questões', ambos:'Teoria + questões', revisao:'Revisão', reforco:'Reforço'};
const FONTES = ['Estratégia (PDF)','Estratégia (vídeo)','TEC Concursos','Resumo próprio','Outro'];
const STATUS = {nao:'Não iniciado', estudando:'Estudando', concluido:'Concluído'};
const INCID = {1:'Baixa',2:'Média',3:'Alta'};

/* ============ Dados ============ */
const padrao = () => ({
  config:{concurso:'',banca:'',horasUtil:3,horasFds:4,dataProva:'',intervalos:[1,7,15,30,60,90],
          ritmoPag:2,blocoMin:30,blocoMax:120,limiar:75,cicloTs:Date.now(),pomodoro:{ativo:true,foco:25,curta:5,longa:15,ciclos:4}},
  materias:[], sessoes:[], revisoes:[], metas:{}, timer:null
});
let S;
function migrar(){
  const daV1 = S && S.config && S.config.blocoMax === undefined;
  S = Object.assign(padrao(), S);
  S.config = Object.assign(padrao().config, S.config);
  if(daV1){ S.config.blocoMin = 30; S.config.blocoMax = 120; }
  if(!S.metas) S.metas = {};
  S.materias.forEach(m => { m.peso = m.peso||3; m.nivel = m.nivel||3; m.curso = m.curso||'';
    m.topicos.forEach(t => { t.incid = t.incid||2; t.paginas = +t.paginas||0; t.feitos = +t.feitos||0; t.status = t.status||'nao'; t.aula = t.aula||''; });
    // curso do TJSP que ficou de um edital anterior (versões antigas não limpavam ao trocar de edital)
    if(/pr[ée]-edital tj-sp/i.test(m.curso) && S.config.concurso && !/tj-?sp|s[ãa]o paulo/i.test(S.config.concurso)){ m.curso = ''; delete m.estCurso; delete m.estAulas; m.topicos.forEach(t => t.aula = ''); } });
  setTimeout(completarEstrategia, 800);
}
// Quem carregou o edital do catálogo antes dos links do Estratégia recebe o link do curso e das aulas
async function completarEstrategia(){
  try{
    if(!S.config.concurso || !S.materias.some(m => m.curso && !m.estCurso)) return;
    const lista = JSON.parse(await lerCatalogo('indice.json'));
    const c = lista.find(x => x.nome === S.config.concurso); if(!c) return;
    const info = lerEstrategia(await lerCatalogo(c.arquivo)); let n = 0;
    S.materias.forEach(m => { const e = info[m.nome.toLowerCase()]; if(e && !m.estCurso && (!e.curso || e.curso === m.curso)){ m.estCurso = e.id; m.estAulas = e.aulas; n++; } });
    if(n){ save(); render(); }
  }catch(e){}
}
function lerEstrategia(texto){        // {matéria: {id, aulas, curso}} a partir das linhas "@estrategia:" do catálogo
  const out = {}; let atual = null;
  texto.split('\n').forEach(l => { l = l.trim(); if(!l || l.startsWith('//')) return;
    const e = l.match(/^@estrategia\s*:\s*(.*)$/i);
    if(e){ if(atual) out[atual.nome.toLowerCase()] = {...parseEstrategia(e[1]), curso: atual.curso}; return; }
    if(l.startsWith('@') || /^[-•*]/.test(l)) return;
    const [nome,,,curso] = l.replace(/^#+\s*/,'').split('|').map(x=>x.trim()); atual = {nome, curso: curso||''}; });
  return out;
}
function parseEstrategia(v){          // "370448 00=3671821,01=3671822" ou o link do curso
  const id = (String(v).match(/cursos\/(\d+)/) || String(v).match(/^\s*(\d{3,})/) || [])[1] || '';
  const aulas = {}; (String(v).match(/\b\d{1,3}=\d+/g) || []).forEach(p => { const [a, b] = p.split('='); aulas[String(+a).padStart(2,'0')] = b; });
  return {id, aulas};
}

let projetando = false;
/* Online: os dados ficam na conta do Claude, divididos em partes para caber nos limites do armazenamento:
   tutor/estado (configuração, edital, revisões), tutor/estado/sessoes/AAAA-MM e tutor/estado/metas/AAAA-MM. */
let ONLINE = null, ultimoSalvo = {}, filaSalvar = null, gravando = false, pendente = false, sujo = false, ultimaLeitura = 0;
const mesDe = d => (d && /^\d{4}-\d{2}/.test(d)) ? d.slice(0,7) : 'sem-data';
function dividirEstado(){
  const feitas = S.revisoes.filter(r=>r.feita).sort((a,b)=>a.feita<b.feita?1:-1).slice(0,120);
  const docs = {'tutor/estado': {config:S.config, materias:S.materias, revisoes:S.revisoes.filter(r=>!r.feita).concat(feitas), timer:S.timer||null, versao:VERSAO}};
  const ses = {}, met = {};
  S.sessoes.forEach(s => { (ses[mesDe(s.data)] = ses[mesDe(s.data)] || []).push(s); });
  Object.entries(S.metas||{}).forEach(([dia,l]) => { (met[mesDe(dia)] = met[mesDe(dia)] || {})[dia] = l; });
  Object.entries(ses).forEach(([m,l]) => docs['tutor/estado/sessoes/'+m] = {lista:l});
  Object.entries(met).forEach(([m,d]) => docs['tutor/estado/metas/'+m] = {dias:d});
  return docs;
}
function statusSync(t){ const el = document.getElementById('sync'); if(el) el.innerHTML = t ? `<span class="chip">${t}</span>` : ''; }
async function carregarOnline(){
  const db = ONLINE.db, e = await db.doc('tutor/estado').get();
  if(!e.exists) return null;

  d.sessoes = []; d.metas = {};
  // os documentos lidos vêm congelados (somente leitura): copia tudo antes de usar
  ses.docs.forEach(x => { const j = JSON.stringify(x.data()||{}); d.sessoes.push(...(JSON.parse(j).lista||[])); ultimoSalvo['tutor/estado/sessoes/'+x.id] = j; });
  met.docs.forEach(x => { const j = JSON.stringify(x.data()||{}); Object.assign(d.metas, JSON.parse(j).dias||{}); ultimoSalvo['tutor/estado/metas/'+x.id] = j; });
  return d;
}
async function gravarOnline(){

const mat = id => S.materias.find(m => m.id === id);
const topico = (m,id) => m && m.topicos.find(t => t.id === id);
function stats(f){let q=0,a=0,min=0;S.sessoes.forEach(s=>{if(f(s)){q+=+s.q||0;a+=+s.a||0;min+=+s.min||0}});return {q,a,min,p:q?a/q:null}}

/* =====================================================================
   Tempo por assunto: teoria (páginas × ritmo, ou estimativa pela incidência)
   × fator do nível + questões (40% × incidência). Blocos de 30 min a 2 h.
   ===================================================================== */
const F_NIVEL = {1:1.3, 2:1.15, 3:1, 4:.85, 5:.7};
const F_INC   = {1:.7, 2:1, 3:1.3};
const SEM_PAG = {1:40, 2:60, 3:90};
function tempoTopico(m,t){
  const nv = F_NIVEL[m.nivel] || 1, fi = F_INC[t.incid] || 1;
  const teoria = t.paginas > 0 ? t.paginas * (+S.config.ritmoPag||2) * nv : SEM_PAG[t.incid||2] * nv;
  const quest = teoria * .4 * fi;
  return {teoria, quest, total: teoria + quest};
}
// Cada assunto tem duas fases: primeiro os blocos de teoria; os blocos de questões só vêm depois de toda a teoria.
function blocosTopico(m,t){
  const mx = +S.config.blocoMax||120, mn = +S.config.blocoMin||30;
  const {teoria, quest} = tempoTopico(m,t);
  const div = total => { const n = Math.max(1, Math.ceil(total / mx)); return {n, dur: Math.min(mx, Math.max(mn, r5(total / n)))}; };
  const T = div(teoria), Q = div(quest), out = [];
  for(let i=0;i<T.n;i++){
    let de=null, ate=null;
    if(t.paginas > 0){ de = Math.floor(t.paginas*i/T.n)+1; ate = Math.floor(t.paginas*(i+1)/T.n); }
    out.push({fase:'teoria', parte:i+1, n:T.n, min:T.dur, de, ate});
  }
  for(let i=0;i<Q.n;i++) out.push({fase:'questoes', parte:i+1, n:Q.n, min:Q.dur, de:null, ate:null});
  return out;
}
const nTeoria = (m,t) => blocosTopico(m,t).filter(b=>b.fase==='teoria').length;
const teoriaConcluida = (m,t) => t.feitos >= nTeoria(m,t);
const tempoMateriaRestante = m => m.topicos.filter(t=>t.status!=='concluido')
  .reduce((s,t)=>{const b=blocosTopico(m,t); return s + b.slice(Math.min(t.feitos,b.length)).reduce((a,x)=>a+x.min,0);},0);

/* ============ Banco de desempenho por assunto ============ */
function indice(topicoId){
  const ss = S.sessoes.filter(s => s.topicoId===topicoId && +s.q>0).sort((a,b)=>(b.ts||0)-(a.ts||0));
  let wq=0, wa=0, q=0;
  ss.forEach((s,i) => { const w = 1/(1+i*.5); wq += w*s.q; wa += w*s.a; q += +s.q; });
  return {p: wq ? wa/wq : null, q, n: ss.length};
}
function classe(p){
  if(p==null) return ['Sem dados',''];
  if(p<.6) return ['Crítico','bad'];
  if(p<lim()) return ['Atenção','warn'];
  if(p<.85) return ['Bom','ok'];
  return ['Forte','ok'];
}
function fatorMateria(m){
  const st = stats(s => s.materiaId === m.id);
  if(st.q < 20) return 1;
  if(st.p < .6) return 1.3;
  if(st.p < lim()) return 1.15;
  if(st.p >= .85) return .85;
  return 1;
}

/* ============ Ciclo de estudos ============ */
const minSemana = () => (5*(+S.config.horasUtil||0) + 2*(+S.config.horasFds||0)) * 60;
const TIPOS_CONTEUDO = ['conteudo','teoria','questoes','ambos','extra'];
function ciclo(extra){
  extra = extra || {};
  const ativos = S.materias.filter(m => m.topicos.some(t => t.status!=='concluido'));
  const ws = ativos.map(m => ({m, w:(+m.peso||1) * (6-(+m.nivel||3)) * fatorMateria(m)}));
  const tot = ws.reduce((s,x)=>s+x.w,0) || 1;
  const unid = Math.floor(minSemana()/5);
  const cotas = ws.map(x => unid*x.w/tot), base = cotas.map(Math.floor);
  let sobra = unid - base.reduce((s,x)=>s+x,0);
  cotas.map((c,i)=>({i, f:c-base[i]})).sort((a,b)=>b.f-a.f).forEach(x=>{ if(sobra>0){ base[x.i]++; sobra--; } });
  return ws.map(({m,w},i) => {
    const alvo = base[i]*5;
    const feito = S.sessoes.filter(s => s.materiaId===m.id && TIPOS_CONTEUDO.includes(s.tipo) && (s.ts||0) >= S.config.cicloTs)
                           .reduce((a,s)=>a+(+s.min||0),0) + (extra[m.id]||0);
    return {m, w, alvo, feito, r: alvo ? feito/alvo : Infinity, fat: fatorMateria(m)};
  });
}
// Ordem de estudo dentro da matéria:
//  'crono-inc' (padrão): ordem das aulas; assuntos de baixa incidência ficam para o fim da matéria
//  'crono': só a ordem das aulas;  'inc': maior incidência primeiro
const numAula = t => { const m = String(t.aula||'').match(/\d+/); return m ? +m[0] : null; };
function ordemTopicos(m){
  const ord = {estudando:0, nao:1}, modo = S.config.ordemEstudo || 'crono-inc';
  const temAula = m.topicos.some(t => numAula(t)!=null);
  const crono = x => temAula ? (numAula(x.t) ?? 999)*1000 + x.i : x.i;
  const onda = x => modo==='crono-inc' && (+x.t.incid||2)===1 ? 1 : 0;
  return m.topicos.map((t,i)=>({t,i})).filter(x=>x.t.status!=='concluido')
    .sort((a,b)=> ord[a.t.status]-ord[b.t.status]
      || (modo==='inc' ? (+b.t.incid||2)-(+a.t.incid||2) : 0)
      || onda(a)-onda(b) || crono(a)-crono(b)).map(x=>x.t);
}
function proxBloco(m, planejados){
  planejados = planejados || {};
  for(const t of ordemTopicos(m)){
    const bl = blocosTopico(m,t), feito = t.feitos + (planejados[t.id]||0);
    if(feito >= bl.length) continue;
    if(bl[feito].fase==='questoes' && !teoriaConcluida(m,t)) continue; // teoria ainda não terminou de verdade
    return {t, ...bl[feito]};
  }
  return null;
}

/* =====================================================================
   Metas do dia — revisões vencidas primeiro, 1 reforço do assunto mais fraco,
   conteúdo novo intercalando matérias (máx. 2 blocos da mesma no dia).
   ===================================================================== */
function capacidade(dia){ const d = parse(dia).getDay(); return ((d===0||d===6) ? +S.config.horasFds : +S.config.horasUtil) * 60 || 0; }
function montarMetas(dia, base){
  const cap = capacidade(dia);
  const metas = (base||[]).slice();
  let usado = metas.reduce((s,x)=>s+(x.min||0),0);
  let revUsado = metas.filter(x=>x.tipo!=='conteudo').reduce((s,x)=>s+(x.min||0),0);
  const ja = new Set(metas.map(x=>x.revisaoId).filter(Boolean));
  const c0 = ciclo(); if(c0.length && c0.every(x=>x.r>=1)){ S.config.cicloTs = Date.now(); }
  const revs = S.revisoes.filter(r => !r.feita && r.due<=dia && !ja.has(r.id)).sort((a,b)=>a.due<b.due?-1:1);
  for(const r of revs){
    const m = mat(r.materiaId), t = topico(m, r.topicoId); if(!t) continue;
    const ix = indice(t.id).p; let min = ix!=null && ix<.6 ? 45 : 30;
    if(revUsado + min > cap*.5 && revUsado > 0) break;
    if(usado + min > cap){ min = r5(cap - usado); if(min < 15) break; }
    metas.push({id:uid(), tipo:'revisao', revisaoId:r.id, materiaId:m.id, topicoId:t.id, min, etapa:r.etapa}); usado += min; revUsado += min;
  }
  const naMeta = new Set(metas.map(x=>x.topicoId));
  const fracos = [];
  S.materias.forEach(m => m.topicos.forEach(t => { const ix = indice(t.id); if(ix.q>=10 && ix.p<lim() && !naMeta.has(t.id)) fracos.push({m,t,p:ix.p}); }));
  fracos.sort((a,b)=>a.p-b.p);
  if(fracos[0] && revUsado + 30 <= cap*.6 && usado + 30 <= cap){ metas.push({id:uid(), tipo:'reforco', materiaId:fracos[0].m.id, topicoId:fracos[0].t.id, min:30}); usado += 30; }
  const extra = {}, plan = {}, cont = {}; let ultima = null, guarda = 0;
  metas.filter(x=>x.tipo==='conteudo').forEach(x=>{ plan[x.topicoId]=(plan[x.topicoId]||0)+(x.feita?0:1); cont[x.materiaId]=(cont[x.materiaId]||0)+1; ultima=x.materiaId; });
  // questões já liberadas (teoria concluída) entram antes de conteúdo novo, até 2 por dia
  const prontas = [];
  S.materias.forEach(m => m.topicos.forEach(t => {
    if(t.status==='concluido' || !teoriaConcluida(m,t) || plan[t.id]) return;
    const b = blocosTopico(m,t)[t.feitos]; if(b && b.fase==='questoes') prontas.push({m,t,b});
  }));
  for(const p of prontas.slice(0,2)){
    let min = p.b.min; if(usado + min > cap){ min = r5(cap - usado); if(min < (+S.config.blocoMin||30)) break; }
    metas.push({id:uid(), tipo:'conteudo', fase:'questoes', materiaId:p.m.id, topicoId:p.t.id, parte:p.b.parte, n:p.b.n, de:null, ate:null, min});
    plan[p.t.id] = 1; extra[p.m.id] = (extra[p.m.id]||0)+min; cont[p.m.id] = (cont[p.m.id]||0)+1; ultima = p.m.id; usado += min;
  }
  while(usado + (+S.config.blocoMin||30) <= cap && guarda++ < 20){
    const c = ciclo(extra).filter(x => x.alvo>0 && proxBloco(x.m, plan)).sort((a,b)=>a.r-b.r || b.w-a.w);
    const e = c.find(x => x.m.id!==ultima && (cont[x.m.id]||0)<2) || c.find(x => (cont[x.m.id]||0)<2);
    if(!e) break;
    const b = proxBloco(e.m, plan);
    let min = b.min;
    if(usado + min > cap){ min = r5(cap - usado); if(min < (+S.config.blocoMin||30)) break; }
    metas.push({id:uid(), tipo:'conteudo', fase:b.fase, materiaId:e.m.id, topicoId:b.t.id, parte:b.parte, n:b.n, de:b.de, ate:b.ate, min});
    plan[b.t.id] = (plan[b.t.id]||0)+1; extra[e.m.id] = (extra[e.m.id]||0)+min; cont[e.m.id] = (cont[e.m.id]||0)+1; ultima = e.m.id; usado += min;
  }
  return metas;
}
function atualizarMetasAntigas(){
  const l = S.metas[hoje()]; if(l && l.some(x=>x.tipo==='conteudo' && !x.feita && !x.fase)) gerarMetas(true);
}
function gerarMetas(manterFeitas){
  const dia = hoje();
  const base = manterFeitas ? (S.metas[dia]||[]).filter(x=>x.feita || x.tipo==='extra') : [];
  S.metas[dia] = montarMetas(dia, base);
  Object.keys(S.metas).forEach(k => { if(diff(k, dia) > 60) delete S.metas[k]; });
  save();
}
function focos(min){
  const pc = S.config.pomodoro; if(!pc || pc.ativo!==false){ const f = (pc&&pc.foco)||25, n = Math.max(1, Math.round(min/f)); return `${n} pomodoro${n>1?'s':''} de ${f} min`; }
  if(min <= 50) return `1 foco de ${min} min`;
  const k = Math.ceil(min/50), f = r5(min/k);
  return `${k} focos de ~${f} min`;
}

/* ============ Cronograma: projeção dos próximos 7 dias ============ */
// Simula a semana numa cópia dos dados, supondo que cada meta seja cumprida.
function projetarSemana(){
  const real = S; projetando = true;
  const out = [];
  try{
    S = JSON.parse(JSON.stringify(real));
    for(let d=0; d<7; d++){
      const dia = addDias(hoje(), d);
      const metas = d===0 ? (S.metas[dia] || montarMetas(dia, [])) : montarMetas(dia, []);
      out.push({dia, metas: JSON.parse(JSON.stringify(metas))});
      metas.filter(x=>!x.feita).forEach(x => {
        const m = mat(x.materiaId), t = topico(m, x.topicoId); if(!t) return;
        S.sessoes.push({id:uid(), ts:Date.now()+d, data:dia, materiaId:m.id, topicoId:t.id, tipo:x.tipo, min:x.min, q:0, a:0});
        if(x.tipo==='conteudo'){ t.feitos++; if(t.status==='nao') t.status='estudando'; if(t.feitos>=blocosTopico(m,t).length){ t.status='concluido'; agendarPrimeira(m.id, t.id, dia); } }
        if(x.tipo==='revisao'){ const r = S.revisoes.find(y=>y.id===x.revisaoId); if(r && !r.feita){ r.feita = dia; agendarProxima(r, null, dia); } }
      });
    }
  } finally { S = real; projetando = false; }
  return out;
}

/* ============ Revisões adaptativas ============ */
function agendarPrimeira(materiaId, topicoId, dia){
  dia = dia || hoje();
  if(S.revisoes.some(r => r.topicoId===topicoId)) return null;
  const r = {id:uid(), materiaId, topicoId, etapa:0, due:addDias(dia, S.config.intervalos[0]), feita:null};
  S.revisoes.push(r); return r.id;
}
function agendarProxima(r, pHoje, dia){
  dia = dia || hoje();
  const iv = S.config.intervalos, L = lim();
  const m = indice(r.topicoId).p ?? pHoje ?? 1;
  let e, f = 1;
  if(m < .6){ e = 0; }
  else if(m < L){ e = r.etapa; f = .5; }
  else { e = Math.min(r.etapa+1, iv.length-1); if(pHoje!=null && pHoje>=.9 && m>=.85) f = 1.25; }
  const dias = Math.max(1, Math.round(iv[e]*f));
  const nova = {id:uid(), materiaId:r.materiaId, topicoId:r.topicoId, etapa:e, due:addDias(dia, dias), feita:null};
  S.revisoes.push(nova); return nova.id;
}

/* ============ Cronômetro (livre ou pomodoro) ============
   Livre: conta o tempo corrido. Pomodoro: alterna foco e pausa; só o foco conta como tempo de estudo. */
const POMO_PADRAO = {ativo:true, foco:25, curta:5, longa:15, ciclos:4};
const cfgPomo = () => Object.assign({}, POMO_PADRAO, S.config.pomodoro||{});
const ehPomo = () => S.timer && S.timer.modo === 'pomodoro';
function durFase(t){ const c = cfgPomo(); if(t.fase==='foco'||t.fase==='espera') return c.foco*60000; return (t.feitos>0 && t.feitos % c.ciclos === 0 ? c.longa : c.curta)*60000; }
const decorridoFase = t => (t.faseFeito||0) + (t.faseInicio ? Date.now()-t.faseInicio : 0);
function tempoTimer(){
  const t = S.timer; if(!t) return 0;
  if(t.modo==='pomodoro') return (t.focoAcum||0) + (t.fase==='foco' ? decorridoFase(t) : 0);
  return (t.acum||0) + (t.inicio ? Date.now()-t.inicio : 0);
}
const rodando = () => S.timer && (ehPomo() ? !!S.timer.faseInicio : !!S.timer.inicio);
function fmtRel(ms){ const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtMin(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function novoTimer(metaId, label){
  const c = cfgPomo();
  return c.ativo ? {metaId, label, modo:'pomodoro', fase:'foco', faseInicio:Date.now(), faseFeito:0, focoAcum:0, feitos:0}
                 : {metaId, label, modo:'livre', inicio:Date.now(), acum:0};
}
async function iniciarMeta(id){
  const meta = (S.metas[hoje()]||[]).find(x=>x.id===id); if(!meta) return;
  if(S.timer && S.timer.metaId!==id && tempoTimer()>60000 && !(await confirmar('Já há um cronômetro rodando em outra atividade. Trocar para esta meta? (o tempo anterior será descartado)'))) return;
  const m = mat(meta.materiaId), t = topico(m, meta.topicoId);
  if(S.timer && S.timer.metaId===id){ if(!rodando()) pausarTimer(); return; }
  S.timer = novoTimer(id, (m?m.nome:'')+' › '+(t?t.nome:''));
  somAviso(true); save(); render();
}
async function iniciarLivre(){
  if(S.timer && tempoTimer()>60000 && !(await confirmar('Já há um cronômetro rodando. Trocar por um pomodoro livre? (o tempo anterior será descartado)'))) return;
  S.timer = novoTimer(null, 'Estudo livre'); if(S.timer.modo!=='pomodoro'){ S.timer = {metaId:null, label:'Estudo livre', modo:'pomodoro', fase:'foco', faseInicio:Date.now(), faseFeito:0, focoAcum:0, feitos:0}; }
  somAviso(true); save(); render();
}
function pausarTimer(){

function avancarPomodoro(){
  const t = S.timer; if(!t || t.modo!=='pomodoro' || !t.faseInicio) return false;
  let mudou = false;
  while(t.faseInicio && decorridoFase(t) >= durFase(t)){
    const fimFase = t.faseInicio + (durFase(t) - (t.faseFeito||0));
    if(t.fase==='foco'){
      t.focoAcum = (t.focoAcum||0) + durFase(t); t.feitos = (t.feitos||0)+1;
      t.fase = 'pausa'; t.faseFeito = 0; t.faseInicio = fimFase;
      const c = cfgPomo(), longa = t.feitos % c.ciclos === 0;
      somAviso(); avisar(`Pomodoro ${t.feitos} concluído! Pausa ${longa?'longa':'curta'} de ${longa?c.longa:c.curta} min: levante, beba água, sem celular.`);
    } else {
      t.fase = 'espera'; t.faseFeito = 0; t.faseInicio = null;
      somAviso(); avisar('Pausa terminada. Clique em "Começar foco" quando estiver pronta.');
    }

  }
  if(mudou){ save(); render(); }

}
let audioCtx = null;

    if(audioCtx.state==='suspended') audioCtx.resume();
    if(soPreparar) return;
    [0, .25, .5].forEach((d,i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i===2 ? 880 : 660; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + d; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.25,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.2);
      o.start(t0); o.stop(t0+.22); });
  }catch(e){}
}

/* ============ Concluir / desfazer metas ============ */
let caixaAberta = null, maisTempo = null, avisoHoje = '';
function adicionarTempo(id, min){
  const metas = S.metas[hoje()]||[], i = metas.findIndex(x=>x.id===id); if(i<0) return;
  const o = metas[i];
  const nova = {id:uid(), tipo:'extra', origem: o.tipo==='extra' ? o.origem : o.tipo, materiaId:o.materiaId, topicoId:o.topicoId, min};
  metas.splice(i+1, 0, nova);
  // respeita as horas líquidas: tira do fim as metas de conteúdo ainda pendentes
  const cap = capacidade(hoje()); let tot = metas.reduce((s,x)=>s+(x.feita?(x.minReal||x.min):x.min),0), movidas = 0;
  const tiradas = [];
  for(let j=metas.length-1; j>=0 && tot>cap; j--){ const x = metas[j]; if(!x.feita && x.tipo==='conteudo'){ tot -= x.min; tiradas.unshift(metas.splice(j,1)[0]); } }
  // devolve as que ainda cabem, na ordem original
  tiradas.forEach(x => { if(tot + x.min <= cap){ metas.push(x); tot += x.min; } else movidas++; });
  avisoHoje = `Tempo extra de ${hm(min)} adicionado.` + (movidas ? ` ${movidas} meta${movidas>1?'s':''} de conteúdo ${movidas>1?'foram':'foi'} para os próximos dias para não passar das horas líquidas.` : '') + (tot>cap ? ' Atenção: hoje já passa das horas líquidas.' : '');
  maisTempo = null; save(); render();
}
function usadoHoje(){ return (S.metas[hoje()]||[]).reduce((s,x)=>s+(x.feita?(x.minReal||x.min):x.min),0); }
function liberarQuestoes(m, t){
  const bl = blocosTopico(m,t)[t.feitos]; if(!bl || bl.fase!=='questoes') return null;
  const metas = S.metas[hoje()] = S.metas[hoje()]||[];
  if(metas.some(x=>!x.feita && x.topicoId===t.id && x.fase==='questoes')) return null;
  const livre = capacidade(hoje()) - usadoHoje(); if(livre < (+S.config.blocoMin||30)) return null;
  const nova = {id:uid(), tipo:'conteudo', fase:'questoes', materiaId:m.id, topicoId:t.id, parte:bl.parte, n:bl.n, de:null, ate:null, min:Math.min(bl.min, r5(livre))};
  metas.push(nova); return nova;
}

/* ============ Gamificação: XP, nível e sequência ============ */
function xpTotal(){
  const metas = Object.values(S.metas).flat().filter(x=>x.feita).length;
  return Math.round(S.sessoes.reduce((s,x)=>s+(+x.min||0)+2*(+x.a||0),0) + 20*metas);
}
function nivel(xp){ const n = Math.floor(Math.sqrt(xp/100))+1; const ini = 100*(n-1)**2, fim = 100*n**2; return {n, ini, fim, p:(xp-ini)/(fim-ini)}; }
function sequencia(){
  const dias = new Set(S.sessoes.map(s=>s.data)); let d = hoje(), n = 0;
  if(!dias.has(d)) d = addDias(d,-1);
  while(dias.has(d)){ n++; d = addDias(d,-1); }
  return n;
}
function cobertura(){
  let tot=0, feito=0;
  S.materias.forEach(m=>m.topicos.forEach(t=>{ const n=blocosTopico(m,t).length; tot+=n; feito+= t.status==='concluido'?n:Math.min(t.feitos,n); }));
  return tot ? feito/tot : 0;
}
function tempoPorTipo(desde){
  const g = {conteudo:0, questoes:0, revisao:0};
  S.sessoes.filter(s=>s.data>=desde).forEach(s=>{
    const k = ['conteudo','teoria','ambos','extra'].includes(s.tipo) ? 'conteudo' : s.tipo==='revisao' ? 'revisao' : 'questoes';
    g[k] += +s.min||0; });
  return g;
}

    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${tam/4.4}" font-weight="700" fill="var(--ink)">${txt??Math.round(v*100)+'%'}</text></svg>`;
}

/* ---------- Painel ---------- */
function vPainel(){

  const ini = segunda(hoje()), sem = stats(s=>s.data>=ini), meta = minSemana();
  const tp = tempoPorTipo(addDias(hoje(),-6)), tpt = tp.conteudo+tp.questoes+tp.revisao;
  const d = parse(hoje()).getDay();
  let h = `<div class="card hero"><div style="flex:1;min-width:240px"><h2>Olá! ${DIAS[d][0].toUpperCase()+DIAS[d].slice(1)}, ${br(hoje())}</h2>

      <div class="mut" style="margin-top:6px;font-size:12px">XP = minutos estudados + 2 por acerto + 20 por meta concluída</div></div></div>`;
  h += `<div class="kpis" style="margin-top:16px">
    <div class="kpi">${anel(plan?feitoMin/plan:0)}<div><div class="mut">Meta de hoje</div><div class="big">${hm(feitoMin)}</div><div class="mut">de ${hm(plan)} · ${metas.filter(x=>x.feita).length}/${metas.length} metas</div></div></div>
    <div class="kpi">${anel(meta?sem.min/meta:0,'var(--rev)')}<div><div class="mut">Semana</div><div class="big">${hm(sem.min)}</div><div class="mut">de ${hm(meta)} planejadas</div></div></div>
    <div class="kpi">${anel(sem.p||0,'var(--ok)',64,sem.q?pct(sem.p):'—')}<div><div class="mut">Acerto na semana</div><div class="big">${sem.q}</div><div class="mut">questões resolvidas</div></div></div>
    <div class="kpi">${anel(cob,'var(--gold)')}<div><div class="mut">Cobertura do edital</div><div class="big">${pct(cob)}</div><div class="mut">do conteúdo estudado</div></div></div></div>`;
  h += cardPomodoro() + (!S.timer ? `<div class="card" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>Pomodoro livre</b><div class="mut">Para estudar fora das metas. Ao terminar, o tempo de foco vai para o Registro avulso.</div></div><button class="b" onclick="iniciarLivre()">▶ Iniciar pomodoro</button></div>` : '');
  const pend = metas.filter(x=>!x.feita).slice(0,4);

    ${pend.length ? pend.map(x=>{const m=mat(x.materiaId),t=topico(m,x.topicoId); if(!t) return '';
      return `<div class="item"><div style="min-width:0"><span class="tipo ${x.fase==='questoes'?'questoes':x.tipo}">${rotuloMeta(x)}</span> <b>${esc(m.nome)}</b><div class="mut">${esc(curto(t.nome,80))} · ${hm(x.min)}</div></div>
      <button class="g" onclick="iniciarMeta('${x.id}');ir('hoje')">▶ Iniciar</button></div>`}).join('') : '<div class="empty">Tudo concluído por hoje.</div>'}</div>`;
  h += `<div class="card"><h2>Tempo por atividade <span class="mut">últimos 7 dias · ${hm(tpt)}</span></h2>

    <div class="leg"><span style="--c:var(--acc)">Teoria + questões ${hm(tp.conteudo)}</span><span style="--c:var(--ok)">Questões ${hm(tp.questoes)}</span><span style="--c:var(--rev)">Revisão ${hm(tp.revisao)}</span></div>` : '<div class="empty">Conclua metas para ver a divisão do seu tempo.</div>'}</div>`;
  h += `<div class="card"><h2>Cobertura do edital por matéria</h2>${S.materias.map(m=>{let tot=0,f=0; m.topicos.forEach(t=>{const n=blocosTopico(m,t).length; tot+=n; f+=t.status==='concluido'?n:Math.min(t.feitos,n);});
      return `<div class="brow"><span>${esc(curto(m.nome,26))}</span><div class="bar"><i style="width:${tot?f/tot*100:0}%"></i></div><span>${pct(tot?f/tot:0)}</span></div>`}).join('')}</div></div>`;
  const al = alertas();

  const mx = Math.max(1,...prox.map(x=>x.n));

    <div class="card"><h2>Revisões nos próximos 7 dias</h2><div class="weeks" style="height:100px">${prox.map((x,i)=>`<div><span>${x.n||''}</span><b style="height:${x.n/mx*100}%;background:var(--rev)"></b>${i===0?'hoje':DIAS3[parse(x.dd).getDay()]}</div>`).join('')}</div></div>

}

/* ---------- Metas de hoje ---------- */
function vHoje(){
  if(!S.materias.length) return vazio();
  if(!S.metas[hoje()]) gerarMetas(false); else atualizarMetasAntigas();
  const metas = S.metas[hoje()] || [];
  const plan = metas.reduce((s,x)=>s+x.min,0), feitoMin = metas.filter(x=>x.feita).reduce((s,x)=>s+(x.minReal||x.min),0);
  let h = cardPomodoro() + `<div class="g2"><div class="col"><div class="card"><h2><span>${DIAS[parse(hoje()).getDay()][0].toUpperCase()+DIAS[parse(hoje()).getDay()].slice(1)}, ${br(hoje())} · <span class="mut">${hm(feitoMin)} de ${hm(plan)}</span></span>
      <button class="g" onclick="confirmar('Refazer as metas pendentes de hoje? As concluídas ficam.').then(ok=>{if(ok){gerarMetas(true);render();}})">Refazer pendentes</button></h2>
      <div class="bar" style="height:10px"><i style="width:${plan?Math.min(100,feitoMin/plan*100):0}%"></i></div>${avisoHoje?`<div class="alert info" style="margin-top:10px">${esc(avisoHoje)}</div>`:''}`;
  if(!metas.length) h += `<div class="empty" style="margin-top:10px">Sem metas para hoje: ${capacidade(hoje())? 'todo o conteúdo do ciclo está concluído.' : 'dia sem horas de estudo em Configurações.'}</div>`;
  metas.forEach((x,i) => { h += cardMeta(x,i); if(i<metas.length-1 && !x.feita) h += `<div class="pausa">pausa de 10 min · levante, beba água, sem celular</div>`; });
  h += `</div></div><div class="col"><div class="card"><h2>Como fazer cada meta</h2><ul class="pl mut" style="padding-left:18px;margin:0">
    <li><b>Teoria:</b> estude a aula indicada do Estratégia e faça seu resumo. Quando toda a teoria do assunto acabar, entra a meta de questões.</li>
    <li><b>Questões:</b> caderno do TEC só da banca do concurso, sobre o assunto, lendo os comentários dos erros.</li>
    <li><b>Revisão:</b> antes de reler, tente lembrar e resolva questões; só depois consulte o resumo nos pontos em que errou.</li>
    <li><b>Reforço:</b> caderno do TEC só do assunto fraco, lendo os comentários dos erros.</li>
    <li>Use ▶ para cronometrar. Ao concluir, registre questões e acertos: isso ajusta o ciclo e as revisões.</li></ul></div>
    <div class="card"><h2>Alertas do tutor</h2>${(al=>al.length?al.map(a=>`<div class="alert ${a.c}">${esc(a.t)}</div>`).join(''):'<div class="empty">Tudo em ordem.</div>')(alertas())}</div></div></div>`;
  return h;
}
const rotuloMeta = x => x.tipo==='conteudo' ? (x.fase==='questoes' ? 'Questões' : 'Teoria') : TIPOS[x.tipo];
function detalheMeta(x,m,t){
  if(x.tipo==='extra') return `Tempo extra para continuar ${x.origem==='revisao'?'a revisão':x.origem==='reforco'?'o reforço':'o assunto'} · feche com questões do TEC`;
  if(x.tipo==='conteudo' && x.fase==='questoes') return `Questões ${x.parte} de ${x.n} · caderno do TEC só da banca ${S.config.banca?esc(S.config.banca)+' ':''}sobre o assunto, lendo os comentários dos erros`;
  if(x.tipo==='conteudo') return `Teoria ${x.parte} de ${x.n}` + (x.de ? ` · PDF págs. ${x.de}–${x.ate}` : '') + ' · leia a aula e faça seu resumo; as questões vêm quando a teoria acabar';
  if(x.tipo==='revisao') return `Revisão ${x.etapa+1} · questões do TEC, depois resumo dos erros`;
  return `Assunto abaixo de ${S.config.limiar}% · caderno de questões do TEC`;
}
function cardMeta(x,i){
  const m = mat(x.materiaId), t = topico(m, x.topicoId);
  if(!m || !t) return '';
  const ix = indice(t.id), [cl, cc] = classe(ix.p);
  const ativa = S.timer && S.timer.metaId===x.id;
  let h = `<div class="meta ${x.feita?'feita':''} ${ativa?'ativa':''}"><div class="ck">${x.feita?'✓':i+1}</div>
    <div style="min-width:0"><div><span class="tipo ${x.fase==='questoes'?'questoes':x.tipo}">${rotuloMeta(x)}</span> <span class="mut">${hm(x.min)} · ${focos(x.min)}</span></div>
      <div class="tit" style="margin-top:4px">${esc(m.nome)} › ${esc(t.nome)}</div>
      <div class="mut">${detalheMeta(x,m,t)}${ix.p!=null?` · <span class="tag ${cc}">${cl} ${pct(ix.p)}</span>`:''}</div>
      ${(t.aula||m.curso||S.config.concurso) && !(x.tipo==='conteudo' && x.fase==='questoes') ? `<div class="aula"><a href="${esc(linkEstrategia(m,t))}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" title="${m.estCurso?'Abrir no Estratégia':'Defina o link do curso na tela Edital'}"><b style="color:var(--acc)">Estratégia</b> · ${m.curso?esc(curto(m.curso,60)):'curso de '+esc(m.nome)+(S.config.concurso?' para '+esc(curto(S.config.concurso,50)):'')}${t.aula?' · <b>'+esc(t.aula)+'</b>':''} ↗</a></div>`:''}
      ${linkTec(m) && (x.fase==='questoes' || x.tipo==='revisao' || x.tipo==='reforco') ? `<div><a class="aula" style="text-decoration:none" href="${esc(linkTec(m))}" target="_blank" rel="noopener"><b style="color:var(--ok)">Abrir caderno no TEC</b> ↗</a></div>` : ''}</div><div class="acts">`;
  if(x.feita) h += `<div style="text-align:right"><b>${x.q?`${x.a}/${x.q} · ${pct(x.a/x.q)}`:'sem questões'}</b><div class="mut">${hm(x.minReal)}</div><button class="lk" onclick="desfazerMeta('${x.id}')">desfazer</button></div>`+
    (maisTempo!==x.id ? `<button class="g" onclick="maisTempo='${x.id}';render()">+ Adicionar tempo</button>` : '');
  else {
    if(ativa) h += `<button class="g" onclick="pausarTimer()">${rodando()?'⏸ Pausar':'▶ Retomar'}</button>`;
    else h += `<button class="g" onclick="iniciarMeta('${x.id}')">▶ Iniciar</button>`;
    if(caixaAberta!==x.id) h += `<button class="b" onclick="caixaAberta='${x.id}';render()">Concluir</button>`;
  }
  h += `</div>`;
  if(x.feita && maisTempo===x.id){
    const assuntoFechado = t.status==='concluido';
    h += `<div class="caixa"><b style="font-size:14px">Você já terminou ${x.tipo==='conteudo'||x.origem==='conteudo' ? (!teoriaConcluida(m,t)&&!assuntoFechado ? 'a teoria' : 'o assunto') : ''} ou precisa de mais tempo?</b>
      <div class="inl">${x.tipo==='conteudo'||x.origem==='conteudo' ? (assuntoFechado ? '<span class="tag ok">assunto já concluído</span>' : !teoriaConcluida(m,t) ? `<button class="g" onclick="terminouTeoria('${x.id}')">Terminei a teoria</button>` : `<button class="g" onclick="terminouAssunto('${x.id}')">Terminei o assunto</button>`) : `<button class="g" onclick="maisTempo=null;render()">Terminei</button>`}
      <div><label for="mt_${x.id}">Mais tempo</label><select id="mt_${x.id}" style="width:auto">${[15,30,45,60,75,90,105,120].map(v=>`<option value="${v}" ${v===30?'selected':''}>${hm(v)}</option>`).join('')}</select></div>
      <button class="b" onclick="adicionarTempo('${x.id}', +document.getElementById('mt_${x.id}').value)">Adicionar tempo</button>
      <button class="g" onclick="maisTempo=null;render()">Cancelar</button></div>
      <p class="mut" style="margin:6px 0 0">O tempo extra entra logo abaixo desta meta. Se o dia passar das horas líquidas, as últimas metas de conteúdo pendentes vão para os próximos dias.</p></div>`;
  }
  if(!x.feita && caixaAberta===x.id){
    const minT = ativa ? Math.max(1, Math.round(tempoTimer()/60000)) : x.min;
    const soTeoria = x.tipo==='conteudo' && x.fase==='teoria';
    h += `<div class="caixa"><b style="font-size:14px">Meta finalizada! ${soTeoria?'Quanto tempo levou?':'Como foi?'}</b>
      <div class="inl">${soTeoria ? '' : `<div><label>Questões feitas</label><input id="cq" type="number" min="0" inputmode="numeric"></div>
      <div><label>Acertos</label><input id="ca" type="number" min="0" inputmode="numeric" onkeydown="if(event.key==='Enter')concluirMeta('${x.id}')"></div>`}
      <div><label>Tempo real (min)</label><input id="cm" type="number" min="0" value="${minT}"></div>
      <button class="b" onclick="concluirMeta('${x.id}')">Salvar</button><button class="g" onclick="caixaAberta=null;render()">Cancelar</button></div>
      <p class="mut" style="margin:6px 0 0">${soTeoria ? 'As questões deste assunto entram nas metas quando toda a teoria estiver concluída.' : x.tipo==='revisao'?`Abaixo de ${S.config.limiar}% o assunto volta mais cedo; acima, o intervalo aumenta.`:'Seu acerto alimenta o índice do assunto e o ajuste do ciclo.'}${ativa?' Tempo preenchido pelo cronômetro.':''}</p></div>`;
  }
  return h + `</div>`;
}

/* ---------- Cronograma ---------- */
function vSemana(){
  if(!S.materias.length) return vazio();
  if(!S.metas[hoje()]) gerarMetas(false); else atualizarMetasAntigas();
  const sem = projetarSemana();
  const c = ciclo(); const tA = c.reduce((s,x)=>s+x.alvo,0), tF = c.reduce((s,x)=>s+Math.min(x.feito,x.alvo),0);
  const restante = S.materias.reduce((s,m)=>s+tempoMateriaRestante(m),0), ms = minSemana();
  let prev = '';
  if(ms && restante){ const semanas = restante/ms, fim = addDias(hoje(), Math.ceil(semanas*7));
    prev = `Conteúdo restante: <b>${hm(restante)}</b> ≈ ${semanas.toFixed(1)} semanas no seu ritmo · término previsto do 1º ciclo de conteúdo: <b>${br(fim)}</b>`;
    if(S.config.dataProva && fim > S.config.dataProva) prev += ` <span class="tag bad">passa da data da prova</span>`; }
  let h = `<div class="card"><h2>Próximos 7 dias</h2><p class="mut" style="margin-top:-6px">Projeção automática supondo que você cumpra as metas. Ela se ajusta sozinha a cada meta concluída, ao seu acerto e às revisões.</p>
    <div class="semana">${sem.map((d,i)=>{const tot=d.metas.reduce((s,x)=>s+x.min,0); const pd=parse(d.dia);
      return `<div class="dia ${i===0?'hj':''}"><h4>${i===0?'Hoje':DIAS3[pd.getDay()]} <span class="mut">${br(d.dia).slice(0,5)}</span></h4><div class="mut">${capacidade(d.dia)?hm(tot)+' de '+hm(capacidade(d.dia)):'descanso'}</div>
      ${d.metas.map(x=>{const m=mat(x.materiaId),t=topico(m,x.topicoId); if(!m||!t) return ''; return `<div class="bl ${x.fase==='questoes'?'questoes':x.tipo} ${x.feita?'feita':''}"><b>${esc(curto(m.nome,24))}</b>${esc(curto(t.nome,48))}<div class="mut">${rotuloMeta(x)} · ${hm(x.min)}${t.aula && x.fase!=='questoes'?' · '+esc(t.aula):''}</div></div>`}).join('')}</div>`}).join('')}</div></div>`;
  h += `<div class="card" style="margin-top:16px"><h2>Ciclo da semana <button class="g" onclick="confirmar('Zerar o progresso e iniciar um novo ciclo?').then(ok=>{if(ok){S.config.cicloTs=Date.now();save();render();}})">Iniciar novo ciclo</button></h2>
    <p class="mut">${prev}<br>Ciclo iniciado em ${br(iso(new Date(S.config.cicloTs)))} · ${hm(tF)} de ${hm(tA)} (= ${hm(ms)} líquidas por semana). Fatia de cada matéria = peso × dificuldade × desempenho; abaixo de ${S.config.limiar}% ganha mais tempo.</p>
    ${c.sort((a,b)=>b.alvo-a.alvo).map(x => `<div class="brow"><span>${esc(curto(x.m.nome,26))} ${x.fat>1?'<span class="tag bad" title="Acerto baixo: mais tempo">+</span>':x.fat<1?'<span class="tag ok" title="Acerto alto: menos tempo">−</span>':''}</span>
      <div class="bar"><i style="width:${Math.min(100,x.r*100)}%"></i></div><span>${hm(x.feito)}/${hm(x.alvo)}</span></div>`).join('')}</div>`;
  return h;
}

/* ---------- Revisões ---------- */
let revAberta = null;
function vRevisoes(){
  const pend = S.revisoes.filter(r => !r.feita).sort((a,b) => a.due<b.due?-1:1);
  const feitas = S.revisoes.filter(r => r.feita).sort((a,b) => a.feita<b.feita?1:-1).slice(0,25);
  return `<div class="grid"><div class="card"><h2>Agenda de revisões</h2>${pend.length ? pend.map(cardRev).join('') : '<div class="empty">A primeira revisão de um assunto é agendada quando você conclui o primeiro bloco dele.</div>'}</div>
    <div class="card"><h2>Revisões feitas</h2>${feitas.length ? `<table><tr><th>Data</th><th>Assunto</th><th class="n">Etapa</th><th class="n">%</th></tr>${feitas.map(r=>{const m=mat(r.materiaId),t=topico(m,r.topicoId);
      return `<tr><td>${br(r.feita).slice(0,5)}</td><td>${esc(t?t.nome:'?')}<div class="mut">${esc(m?m.nome:'')}</div></td><td class="n">${r.etapa+1}</td><td class="n">${r.p==null?'—':`<span class="tag ${corP(r.p)}">${pct(r.p)}</span>`}</td></tr>`}).join('')}</table>` : '<div class="empty">Nenhuma ainda.</div>'}
    <h3>Regra adaptativa</h3><p class="mut">Intervalos base: ${S.config.intervalos.join(', ')} dias. Depois de cada revisão, o índice do assunto decide: abaixo de 60% recomeça do 1º intervalo; abaixo de ${S.config.limiar}% repete o intervalo pela metade (mais contato); acima avança; muito bom avança com intervalo 25% maior.</p></div></div>`;
}
function cardRev(r){
  const m = mat(r.materiaId), t = topico(m, r.topicoId);
  if(!m || !t) return '';
  const atraso = diff(r.due, hoje()), ix = indice(t.id);
  let h = `<div class="item"><div><b>${esc(t.nome)}</b><div class="mut">${esc(m.nome)} · revisão ${r.etapa+1}${ix.p!=null?` · índice ${pct(ix.p)}`:''}
    ${atraso>0?` · <span class="tag bad">${atraso}d atrasada</span>`:r.due>hoje()?` · ${br(r.due)}`:' · <span class="tag rev">hoje</span>'}</div></div>
    ${r.due<=hoje()?`<button class="g" onclick="revAberta='${r.id}';render()">Fazer agora</button>`:''}</div>`;
  if(revAberta === r.id) h += `<div class="caixa"><div class="inl">
      <div><label>Questões</label><input id="rq" type="number" min="0"></div>
      <div><label>Acertos</label><input id="ra" type="number" min="0"></div>
      <div><label>Minutos</label><input id="rm" type="number" min="0" value="30"></div>
      <button class="b" onclick="revisaoAvulsa('${r.id}')">Salvar</button></div></div>`;
  return h;
}
function revisaoAvulsa(id){

async function lerCatalogo(arq){
  if(window.CATALOGO_EMBUTIDO && window.CATALOGO_EMBUTIDO[arq]) return window.CATALOGO_EMBUTIDO[arq];
  const r = await fetch(CATALOGO+arq+'?t='+Date.now()); if(!r.ok) throw new Error('HTTP '+r.status);
  return r.text();
}
async function buscarConcurso(){
  buscaTermo = document.getElementById('bq').value.trim(); buscaMsg = 'Buscando...'; buscaRes = null; render();
  try{
    const lista = JSON.parse(await lerCatalogo('indice.json')); const termos = norm(buscaTermo).split(/\s+/).filter(Boolean);
    buscaRes = lista.filter(c => { const alvo = norm([c.nome,c.cargo,c.banca,c.orgao,(c.palavras||[]).join(' ')].join(' ')); return termos.every(t => alvo.includes(t)); });
    buscaMsg = buscaRes.length ? '' : `Ainda não há “${esc(buscaTermo)}” no catálogo. Peça no Claude: <b>“adicione o concurso ${esc(buscaTermo)} ao catálogo”</b>. Depois de publicado, ele aparece nesta busca.`;
  }catch(e){ buscaMsg = 'Não foi possível acessar o catálogo agora (verifique a internet). Detalhe: '+esc(e.message); }

}
async function carregarConcurso(arq){
  let substituir = false;
  if(S.materias.length){
    substituir = await confirmar('Você já tem um edital no programa.\n\nConfirmar = SUBSTITUIR pelo edital escolhido (assuntos que já têm estudo registrado são mantidos; o resto é trocado).\nCancelar = não carregar nada.');

const limpaNomeTopico = l => l.replace(/^[-•*]\s*/,'').replace(/\[[^\]]*\]/,'').replace(/#\s*\d+/,'').replace(/\*\s*[123](?!\d)/,'').replace(/\s+/g,' ').trim();
function limparSemHistorico(texto){
  const novos = new Set(), mats = new Set(); let atual = null;
  texto.split('\n').forEach(l => { l = l.trim(); if(!l || l.startsWith('//') || l.startsWith('@')) return;
    if(/^[-•*]/.test(l)){ if(atual) novos.add(atual+'|'+limpaNomeTopico(l).toLowerCase()); }
    else { atual = l.replace(/^#+\s*/,'').split('|')[0].trim().toLowerCase(); mats.add(atual); } });
  const usados = new Set(S.sessoes.map(s=>s.topicoId));
  S.materias.forEach(m => { m.topicos = m.topicos.filter(t => usados.has(t.id) || t.feitos>0 || novos.has(m.nome.toLowerCase()+'|'+t.nome.toLowerCase())); });
  const ids = new Set(S.materias.flatMap(m=>m.topicos.map(t=>t.id)));
  S.revisoes = S.revisoes.filter(r => ids.has(r.topicoId));
  S.materias = S.materias.filter(m => m.topicos.length || mats.has(m.nome.toLowerCase()) || S.sessoes.some(s=>s.materiaId===m.id));
  // curso do Estratégia, aulas e cadernos do TEC eram do concurso anterior: o novo edital traz os seus
  S.materias.forEach(m => { m.curso = ''; m.tecLink = ''; delete m.tecAtualizado; delete m.estCurso; delete m.estAulas; m.topicos.forEach(t => { t.aula = ''; delete t.tecQ; }); });
  S.config.tecLinkGeral = '';
}

/* ---------- Importar edital em PDF ----------

   e, quando o quadro de provas traz o nº de questões, calcula os pesos. Tudo vai para revisão antes de importar. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

async function carregarPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=PDFJS+'pdf.min.js'; s.onload=ok;
    s.onerror=()=>err(new Error('não foi possível carregar o leitor de PDF. Verifique a internet.')); document.head.appendChild(s); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob(["importScripts('"+PDFJS+"pdf.worker.min.js');"],{type:'text/javascript'}));
  return window.pdfjsLib;
}
async function linhasDoPdf(buf){
  const lib = await carregarPdfJs();
  const doc = await lib.getDocument({data:buf}).promise;
  const linhas = [];
  for(let p=1; p<=doc.numPages; p++){
    const c = await (await doc.getPage(p)).getTextContent();
    let atual = '', lastY = null;
    for(const it of c.items){
      const y = it.transform ? it.transform[5] : null;
      if(lastY!==null && y!==null && Math.abs(y-lastY) > 2){ linhas.push(atual); atual=''; }
      atual += (atual && !/\s$/.test(atual) && !/^\s/.test(it.str) ? ' ' : '') + it.str;
      lastY = y;
      if(it.hasEOL){ linhas.push(atual); atual=''; lastY=null; }
    }
    if(atual) linhas.push(atual);
  }
  return linhas.map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
}
const MINUSC = new Set(['de','da','do','das','dos','e','em','a','o','as','os','para','com','no','na','nos','nas','à','ao']);
const tituloMat = s => s.toLowerCase().split(' ').map((w,i)=> i>0 && MINUSC.has(w) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const MATERIA_CONHECIDA = /^(l[íi]ngua portuguesa|portugu[êe]s|matem[áa]tica( financeira)?|racioc[íi]nio l[óo]gico|(no[çc][õo]es de )?inform[áa]tica|atualidades|direito [a-zà-ú ]{3,40}|legisla[çc][ãa]o [a-zà-ú ,\-]{3,60}|administra[çc][ãa]o (p[úu]blica|geral|financeira)[a-zà-ú ]*|contabilidade [a-zà-ú ]*|economia|estat[íi]stica|arquivologia|[ée]tica [a-zà-ú ]*|reda[çc][ãa]o|normas [a-zà-ú ]{3,60}|estatuto [a-zà-ú ]{3,60}|conhecimentos (sobre|de|do|da) [a-zà-ú ]{3,60})/i;
const GRUPO = /^(conhecimentos (gerais|b[áa]sicos|espec[íi]ficos|comuns|em [a-zà-ú ]+|de direito)$|n[íi]vel (m[ée]dio|superior|fundamental)|cargos?\b|para (todos|o cargo|os cargos)|anexo|conte[úu]do(s)? program[áa]tico|parte [ivx\d]|m[óo]dulo|bloco [ivx\d]|prova (objetiva|discursiva)|disciplinas?$|mat[ée]rias?$)/i;
function ehCabecalho(l){
  const s = l.replace(/[:\-–]\s*$/,'').trim();
  if(s.length < 4 || s.length > 90 || /^\d/.test(s)) return false;
  const letras = s.replace(/[^A-Za-zÀ-ÿ]/g,''); if(letras.length < 4) return false;
  const maius = letras.replace(/[^A-ZÀ-Þ]/g,'').length / letras.length;
  if(maius > .85) return true;
  return MATERIA_CONHECIDA.test(s) && s.length <= 70 && !/[.;]$/.test(l);
}
function editalParaTexto(linhas){
  const n = linhas.map(norm);
  // início: ocorrência de "conteúdo programático" seguida de uma matéria reconhecível
  // prefere a linha que é título (anexo/cabeçalho curto) e que é seguida de matérias; menções no meio do texto ficam de fora
  const cands = n.map((l,i)=>i).filter(i=>/conteudo(s)? programatico/.test(n[i]));
  const segue = i => linhas.slice(i+1,i+40).some(x=>MATERIA_CONHECIDA.test(x.replace(/^[\d.\s–-]+/,'')));
  const titulo = i => linhas[i].length <= 80 && (ehCabecalho(linhas[i]) || /^anexo/.test(n[i]) || /^conteudo/.test(n[i]));
  let ini = cands.find(i=>titulo(i) && segue(i));
  if(ini === undefined) ini = cands.find(i=>titulo(i));
  if(ini === undefined) ini = cands.find(segue);
  if(ini === undefined) ini = cands.length ? cands[0] : -1;
  let fim = linhas.length;
  if(ini >= 0){ for(let i=ini+5;i<linhas.length;i++){ if(/^anexo\s+[ivxl\d]+\b/.test(n[i]) && !/conteudo(s)? programatico/.test(n[i])){ fim = i; break; } } }
  const corpo = linhas.slice(ini>=0 ? ini+1 : 0, fim);
  const mats = []; let atual = null;
  for(let l of corpo){
    l = l.replace(/^[\dIVX]+[.)\-–]\s+(?=[A-ZÀ-Þ])/,'');
    let cab = null, resto = '';
    const dp = l.match(/^([^:]{4,70}):\s*(.*)$/);
    if(dp && (ehCabecalho(dp[1]) || MATERIA_CONHECIDA.test(dp[1].trim()))){ cab = dp[1]; resto = dp[2]; }
    else if(ehCabecalho(l)) cab = l;
    if(cab){
      cab = cab.replace(/[:\-–]\s*$/,'').trim();
      if(GRUPO.test(norm(cab))){ if(resto) (atual||{}).txt += ' '+resto; continue; }
      atual = {nome: tituloMat(cab), txt: resto}; mats.push(atual); continue;
    }
    if(atual) atual.txt += ' ' + l;
  }
  const out = [];
  mats.forEach(m => {
    let t = m.txt.replace(/\s+/g,' ').replace(/(^|[.;:]\s+)\d+(\.\d+)*[.)]\s+(?=[A-ZÀ-Þ])/g,'$1');
    let tops = t.split(/(?<=[.;])\s+(?=[A-ZÀ-Þ"“(])/).map(x=>x.replace(/^(\d+(\.\d+)*[.)]|[\-–•])\s+/,'').replace(/[.;,\s]+$/,'').trim()).filter(x=>x.length>=4);
    tops = tops.map(x=> x.length>180 ? x.slice(0,177)+'…' : x);
    const vistos = new Set(); tops = tops.filter(x=>{ const k=norm(x); if(vistos.has(k)) return false; vistos.add(k); return true; });
    if(tops.length) out.push({nome:m.nome, tops});
  });
  // pesos pelo nº de questões do quadro de provas (texto antes do conteúdo programático)
  const antes = n.slice(0, ini>0 ? ini : 0).join('\n');
  out.forEach(m => {
    const re = new RegExp(norm(m.nome).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^\\n\\d]{0,25}(\\d{1,2})\\b');
    const mm = antes.match(re); m.q = mm ? +mm[1] : null;
    m.peso = m.q==null ? 3 : m.q>=15 ? 5 : m.q>=9 ? 4 : m.q>=5 ? 3 : m.q>=3 ? 2 : 1;
  });
  const txt = out.map(m => `${m.nome} | ${m.peso} | 3\n` + m.tops.map(x=>`- ${x.replace(/[\[\]#*]/g,'')} *2`).join('\n')).join('\n\n');
  const id = identificarEdital(linhas);
  return {texto: txt, concurso: id.concurso, banca: id.banca, materias: out.length, assuntos: out.reduce((s,m)=>s+m.tops.length,0), comPeso: out.filter(m=>m.q!=null).length, achou: ini>=0};
}
const BANCAS = [['VUNESP',/vunesp/],['FGV',/\bfgv\b|fundacao getulio vargas/],['CEBRASPE',/cebraspe|\bcespe\b/],['FCC',/\bfcc\b|fundacao carlos chagas/],['IBFC',/\bibfc\b/],['IADES',/\biades\b/],['QUADRIX',/quadrix/],['AOCP',/\baocp\b/],['IDECAN',/idecan/],['FUNDATEC',/fundatec/],['CONSULPLAN',/consulplan/],['SELECON',/selecon/],['IBADE',/\bibade\b/],['FEPESE',/fepese/],['CESGRANRIO',/cesgranrio/],['FUMARC',/fumarc/],['OBJETIVA',/instituto objetiva/],['LEGALLE',/legalle/],['IGEDUC',/igeduc/],['COMPERVE',/comperve/],['NC-UFPR',/nc-?ufpr|nucleo de concursos/],['Instituto AOCP',/instituto aocp/],['Instituto Acesso',/instituto acesso/],['FAPEC',/\bfapec\b/],['CETREDE',/cetrede/]];
function identificarEdital(linhas){

  const orgao = linhas.slice(0, 80).find(l => l.length >= 8 && l.length <= 110 && ORGAO.test(norm(l)) && !/banca|organizadora/i.test(l));
  let cargo = ''; const mc = linhas.slice(0, 200).join(' ').match(/cargos? (?:de|:)\s*([A-ZÀ-Þa-zà-ÿ ]{4,60}?)(?=[,.;\-–(]|\s+(?:do|da|para|n[ºo°]|e\s|com)\b)/i);
  if(mc) cargo = tituloMat(mc[1].trim());
  const concurso = orgao ? tituloMat(orgao.replace(/[.,;:\-–]+$/,'').trim()) + (cargo ? ' – ' + cargo : '') : '';

}
async function lerEditalPdf(file){

    const r = editalParaTexto(linhas);

/* ---------- Incidência pelo TEC ----------
   O programa não consegue abrir o TEC sozinho (exige login e o site bloqueia leitura por outros sites).
   Por isso: o link fica guardado por matéria (botão "Abrir caderno no TEC" nas metas de questões) e o
   conteúdo do caderno entra colando o texto da página ou enviando a planilha exportada do caderno. */
let tecEstado = null; // {materiaId, itens:[{nome,q,alvo}], origem}
const TEC_PARE = new Set('de da do das dos e em a o as os para com no na nos nas ao aos por sobre entre ou um uma que se questoes questao mescladas mesclados outras outros topicos casos gerais geral disposicoes lei n no nº art arts cf cp cpp cpc cf88 ate parte i ii iii iv v vi vii secao secoes capitulo cap tomo nao demais variadas assuntos dispositivos envolvendo exercicios inclui etc'.split(' '));
function tecTokens(s){ return norm(s).replace(/(\d)\.(\d{3})/g,'$1$2').split(/[^a-z0-9]+/).filter(w => w && !TEC_PARE.has(w) && !/^\d+$/.test(w) && w.length>2); }
function tecLeis(s){ return (norm(s).replace(/(\d)\.(\d{3})/g,'$1$2').match(/\b(\d{4,5})\s*\/\s*\d{2,4}\b|\blei\s*(?:n[ºo.]*\s*)?(\d{4,5})/g)||[]).map(x=>(x.match(/\d{4,5}/)||[''])[0]); }
function tecArtigos(s){
  const t = norm(s).replace(/(\d)\.(\d{3})/g,'$1$2'); const iv = [];
  const re = /arts?\.?\s*([\d][\d\-a-z;,\s]*(?:\s(?:a|ao|e)\s[\d][\d\-a-z;,\s]*)*)/g; let m;
  while((m = re.exec(t))){ const seg = m[1];
    const r = /(\d{1,4})(?:-[a-z])?(?:\s*(?:a|ao)\s*(\d{1,4}))?/g; let k;
    while((k = r.exec(seg))){ const a = +k[1], b = k[2] ? +k[2] : a; if(a>0 && a<2000 && b>=a && b-a<600) iv.push([a,b]); } }
  return iv;
}
function tecSobreposicao(A,B){
  if(!A.length || !B.length) return 0; let s = 0, la = 0;
  A.forEach(([a1,a2]) => { la += a2-a1+1; B.forEach(([b1,b2]) => { const o = Math.min(a2,b2)-Math.max(a1,b1)+1; if(o>0) s += o; }); });
  return Math.min(1, s/la);
}
const tecParecidas = (w, b) => { if(w===b) return true; const mn = Math.min(w.length, b.length); if(mn < 3) return false;
  let k = 0; while(k < mn && w[k]===b[k]) k++;
  return k===mn ? Math.abs(w.length-b.length) <= 3 : k >= Math.max(5, Math.round(mn*0.6)); };
function tecPontuar(item, t, unicas, nomeAlt){
  const A = tecTokens(nomeAlt || item.nome), Bl = tecTokens(t.nome), B = new Set(Bl);
  const comunsA = A.filter(w => [...B].some(b => tecParecidas(w,b)));
  const comuns = comunsA.length;
  const cobertura = Math.max(A.length ? comuns/A.length : 0, Bl.length ? Bl.filter(b=>A.some(w=>tecParecidas(w,b))).length/Bl.length : 0);
  const bonus = unicas ? (comunsA.some(w => unicas.has(w)) ? 0.3 : 0) : 0;
  const leiA = tecLeis(item.nome), leiB = tecLeis(t.nome);
  // artigos só contam como sinal forte quando são da mesma lei (arts. da LEP ≠ arts. das Normas da Corregedoria)
  const art = tecSobreposicao(tecArtigos(item.nome), tecArtigos(t.nome)) * (leiA.length && !leiB.length ? 0.3 : 1);
  const lei = leiA.length && leiB.length ? (leiA.some(x=>leiB.includes(x)) ? 1 : -0.6) : 0;
  return cobertura + bonus + 1.5*art + 0.8*lei;
}
// Texto colado: pares "Assunto" / "123 questões" (página de detalhes do caderno do Guia do TEC)
function tecLerTexto(txt){
  const L = txt.split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean), itens = [];
  for(let i=0;i<L.length;i++){
    let m = L[i].match(/^(\d{1,6})\s+quest(?:ões|oes|ão|ao)\b/i);
    if(m && i>0 && !/^\d{1,6}\s+quest/i.test(L[i-1]) && !/\d\s+quest(?:ões|oes|ão|ao)\b/i.test(L[i-1])){ itens.push({nome:L[i-1], q:+m[1]}); continue; }
    m = L[i].match(/^(.{4,}?)\s+(\d{1,6})\s+quest(?:ões|oes|ão|ao)\b/i);
    if(m) itens.push({nome:m[1], q:+m[2]});
  }
  if(itens.length >= 3) return tecSoFolhas(itens);
  return tecLerIndice(L);
}
// Aba "Índice" do caderno do TEC: cada assunto vem seguido do número da questão em que ele começa
// (1, 1, 1, 2, 2, 5...). As questões de um assunto = início do próximo − início dele; quem tem 0 é grupo.
const TEC_TOPO = /^(direitos? |legislacao|lingua |matematica|informatica|raciocinio|atualidades|estatistica|conhecimentos|nocoes|etica|arquivologia|contabilidade|administracao (geral|publica$|financeira)|redacao|portugues|ingles|espanhol|historia|geografia|filosofia|sociologia|psicologia|auditoria|gestao)/;
function tecLerIndice(L){
  const num = s => /^\d{1,5}$/.test(s), pares = [];
  for(let i = 0; i < L.length; i++){
    if(!num(L[i]) && i + 1 < L.length && num(L[i+1])){ pares.push({nome:L[i], ini:+L[i+1]}); i++; continue; }
    const t = L[i].match(/^(.*\S)\t+(\d{1,5})$/); if(t) pares.push({nome:t[1], ini:+t[2]});
  }
  if(pares.length < 3) return [];
  let cresc = 0; for(let i = 1; i < pares.length; i++) if(pares[i].ini >= pares[i-1].ini) cresc++;
  if(cresc < (pares.length - 1) * 0.9) return [];
  const tot = L.join(' ').match(/(\d{1,6})\s+quest(?:ões|oes)\b/i), total = tot ? +tot[1] : 0;
  const out = []; let grupoMat = '', cadeia = [], novaCadeia = true;
  pares.forEach((x, i) => {
    const prox = pares[i+1], q = prox ? prox.ini - x.ini : (total >= x.ini ? total - x.ini + 1 : 1);
    const ehMat = tecMateriaPorNome(x.nome);
    if(q <= 0){                                  // grupo (o primeiro subassunto começa na mesma questão)
      if(ehMat || (novaCadeia && TEC_TOPO.test(norm(x.nome)))){ grupoMat = x.nome; cadeia = []; } // começo de outra matéria do TEC
      else { if(novaCadeia) cadeia = []; cadeia.push(x.nome); }
      novaCadeia = false; return;
    }
    if(ehMat && !cadeia.length) grupoMat = x.nome;
    const caminho = [grupoMat, ...cadeia].filter(Boolean);
    out.push({nome:x.nome, q, contexto:caminho.join(' '), caminho});
    novaCadeia = true;
  });
  return out;
}
// Remonta a árvore (a lista do TEC vem "achatada": grupo, subassuntos, sub-subassuntos...) e devolve só as folhas,
// cada uma com os nomes dos grupos acima como contexto. Um item só é grupo quando os itens seguintes somam
// o total dele (com uma pequena folga para questões marcadas direto no grupo) e, havendo artigos de lei nos nomes,
// quando os artigos dos filhos estão dentro da faixa do grupo.
function tecSoFolhas(itens){
  const n = itens.length, memo = new Map(), escolha = new Map(), fimPai = new Map();
  const arts = itens.map(x => tecArtigos(x.nome));
  const folga = p => { const q = itens[p].q; return Math.max(Math.min(3, Math.floor(q * 0.1)), Math.floor(q * 0.03)); };
  const cabe = (i, p) => !arts[i].length || !arts[p].length || tecSobreposicao(arts[i], arts[p]) >= 0.999;
  let passos = 0;
  function filhos(i, alvo, p){
    if(alvo === 0) return i;
    const k = i + '|' + alvo + '|' + p;
    if(memo.has(k)) return memo.get(k);
    memo.set(k, -1);
    let r = -1;
    if(i < n && ++passos < 300000 && cabe(i, p) && itens[i].q <= alvo + folga(p)){
      const fp = paiAte(i);
      for(const fim of (fp > i + 1 ? [fp, i + 1] : [i + 1])){
        const resto = filhos(fim, alvo - itens[i].q, p);
        if(resto >= 0){ r = resto; escolha.set(k, fim); break; }
      }
    }
    if(r < 0 && i > p + 1 && Math.abs(alvo) <= folga(p)) r = i;
    memo.set(k, r); return r;
  }
  function paiAte(p){                  // fim dos filhos de p, ou -1 se p não é grupo
    if(fimPai.has(p)) return fimPai.get(p);
    fimPai.set(p, -1);
    let fim = p + 1 < n && itens[p].q > 0 ? filhos(p + 1, itens[p].q, p) : -1;
    if(fim === p + 2 && itens[p + 1].q !== itens[p].q) fim = -1;   // um filho só, sem bater o total: não é grupo
    fimPai.set(p, fim); return fim;
  }
  const folhas = [];
  function montar(p, pais){
    let i = p + 1, alvo = itens[p].q;
    while(true){
      const fim = escolha.get(i + '|' + alvo + '|' + p);
      if(fim === undefined) break;
      if(fim > i + 1) montar(i, pais.concat(itens[i].nome));
      else folhas.push({nome:itens[i].nome, q:itens[i].q, contexto:pais.join(' '), caminho:pais.slice()});
      alvo -= itens[i].q; i = fim;
    }
    if(alvo >= 3 && pais.length > 1) folhas.push({nome:itens[p].nome, q:alvo, contexto:pais.slice(0, -1).join(' '), caminho:pais.slice(0, -1), sobra:true});
  }
  let i = 0;
  while(i < n){
    const fp = paiAte(i);
    if(fp > i + 1){ montar(i, [itens[i].nome]); i = fp; }
    else { folhas.push({nome:itens[i].nome, q:itens[i].q, contexto:'', caminho:[]}); i++; }
  }
  return folhas;
}
// Planilha exportada do caderno: conta as questões por valor da coluna "Assunto"
async function tecLerPlanilha(file){
  if(!window.XLSX) await new Promise((ok,err)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=ok; s.onerror=()=>err(new Error('não foi possível carregar o leitor de planilhas')); document.head.appendChild(s); });
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
  const iCab = linhas.findIndex(r => r.some(c => /assunto/i.test(String(c))));
  if(iCab < 0) throw new Error('não achei a coluna "Assunto" na planilha');
  const col = linhas[iCab].findIndex(c => /assunto/i.test(String(c))), cont = {};
  const colM = linhas[iCab].findIndex(c => /mat[eé]ria|disciplina/i.test(String(c)));
  linhas.slice(iCab+1).forEach(r => { const mt = colM >= 0 ? String(r[colM]||'').trim() : '';
    String(r[col]||'').split(/\s*[;|]\s*|\n/).map(s=>s.trim()).filter(Boolean).forEach(a => { const k = mt + '\u0001' + a; cont[k] = (cont[k]||0)+1; }); });
  return Object.entries(cont).map(([k,q]) => { const [mt, nome] = k.split('\u0001'); return {nome, q, contexto:mt, caminho: mt ? [mt] : []}; });
}
const tecUnicasCache = {};
function tecUnicas(m){
  const freq = {}; m.topicos.forEach(t => new Set(tecTokens(t.nome)).forEach(w => freq[w] = (freq[w]||0)+1));
  return new Set(Object.keys(freq).filter(w => freq[w]===1));
}
function tecMelhorTopico(m, x){          // melhor assunto do edital dentro da matéria m, com a pontuação
  const unicas = tecUnicasCache[m.id] || (tecUnicasCache[m.id] = tecUnicas(m));
  let best = null, bp = 0;
  m.topicos.forEach(t => { const p = tecPontuar(x, t, unicas); if(p > bp){ bp = p; best = t; } });
  if(bp < .45 && x.contexto){ // tenta com o nome do grupo (ex.: "Polissemia" dentro de "Semântica")
    const grupos = (x.caminho||[]).filter(g => !tecMateriaPorNome(g)), perto = grupos[grupos.length-1];
    [perto, x.contexto].filter(Boolean).forEach(c =>
      m.topicos.forEach(t => { const p = 0.8*tecPontuar(x, t, unicas, x.nome+' '+c); if(p > bp){ bp = p; best = t; } }));
  }
  return {t: best, p: bp};
}
function tecMateriaPorNome(nome){        // "Língua Portuguesa (Português)" → Língua Portuguesa
  const A = tecTokens(nome); if(!A.length) return null;
  let melhor = null, mp = 0;
  S.materias.forEach(m => { const B = tecTokens(m.nome); if(!B.length) return;
    const cobA = A.filter(w => B.some(b => tecParecidas(w,b))).length / A.length;
    const cobB = B.filter(b => A.some(w => tecParecidas(w,b))).length / B.length;
    const p = cobB >= .99 ? (cobA + cobB) / 2 : cobB * cobA;
    if(p > mp){ mp = p; melhor = m; } });
  return mp >= .6 ? melhor : null;
}
function tecCruzar(materiaId, itens, origem){
  if(!itens.length) return;
  for(const k in tecUnicasCache) delete tecUnicasCache[k];
  const unica = materiaId && materiaId !== '*' ? mat(materiaId) : null;
  itens.forEach(x => {
    let m = unica;
    if(!m) for(const g of (x.caminho||[])){ m = tecMateriaPorNome(g); if(m) break; }
    let r = m ? tecMelhorTopico(m, x) : {t:null, p:0};
    if(!unica && r.p < .4){ // grupo sem nome de matéria reconhecível: procura em todas as matérias
      S.materias.forEach(mm => { const rr = tecMelhorTopico(mm, x); if(rr.p > r.p + .05 && rr.p >= (m ? .7 : .5)){ r = rr; m = mm; } });
    }
    x.mid = m ? m.id : '';
    x.alvo = r.p >= .4 && r.t ? r.t.id : '';
  });
  // sobras marcadas direto no grupo da matéria ("Língua Portuguesa (Português)") não são um assunto: saem da lista
  for(let k = itens.length - 1; k >= 0; k--) if(itens[k].sobra && !itens[k].alvo && tecMateriaPorNome(itens[k].nome)) itens.splice(k, 1);
  const mids = [...new Set(itens.filter(x=>x.alvo).map(x=>x.mid))];
  tecEstado = {materiaId: unica ? unica.id : (mids.length===1 ? mids[0] : '*'), itens, origem};
}
async function tecProcessar(tipo){
  const sel = document.getElementById('tecMat'), link = document.getElementById('tecLink').value.trim();
  if(link && !/^https:\/\/(www\.)?tecconcursos\.com\.br\//i.test(link)) return avisar('Use um link do TEC Concursos (https://www.tecconcursos.com.br/...).');
